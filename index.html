<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mage Idle P0.3A-3</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  background:#0d1117;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  padding:12px;
}

#app{
  max-width:760px;
  margin:auto;
}

h1{
  margin:5px 0;
  font-size:22px;
}

#sub{
  color:#8b949e;
  font-size:13px;
  margin-bottom:10px;
}

#status{
  background:#161b22;
  border:1px solid #30363d;
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:10px;
  line-height:1.7;
  font-size:14px;
}

#action{
  color:#58a6ff;
  font-weight:bold;
}

#frame{
  color:#7ee787;
  font-weight:bold;
}

#size{
  color:#f2cc60;
}

/* =========================
   MAP
========================= */

#game{
  position:relative;
  width:100%;
  height:520px;
  overflow:hidden;

  border:2px solid #42643b;
  border-radius:14px;

  background:
    radial-gradient(
      circle at 20% 25%,
      rgba(255,255,255,.07) 0 3px,
      transparent 4px
    ),
    radial-gradient(
      circle at 75% 70%,
      rgba(0,0,0,.08) 0 4px,
      transparent 5px
    ),
    linear-gradient(
      #699957,
      #527c46
    );
}

/* =========================
   MAGE
========================= */

#mage{
  position:absolute;

  width:112px;
  height:120px;

  transform:translate(-50%,-85%);

  pointer-events:none;
  z-index:10;
}

#shadow{
  position:absolute;

  width:44px;
  height:12px;

  left:50%;
  bottom:8px;

  transform:translateX(-50%);

  border-radius:50%;

  background:rgba(0,0,0,.24);
}

/*
  顯示窗口。

  比實際CELL稍微小一點，
  用來切掉最外圍容易出現的碎片。
*/

#spriteWindow{
  position:absolute;

  width:96px;
  height:96px;

  left:8px;
  bottom:14px;

  overflow:hidden;
}

/*
  真正的Sprite Sheet。
*/

#sprite{
  position:absolute;

  max-width:none;

  pointer-events:none;
  user-select:none;

  image-rendering:auto;
}

/* =========================
   CONTROLS
========================= */

#controls{
  display:flex;
  gap:8px;
  margin-top:10px;
}

button{
  flex:1;

  padding:11px;

  border:0;
  border-radius:9px;

  background:#30363d;
  color:white;

  font-size:14px;
  font-weight:bold;
}

#info{
  margin-top:10px;

  padding:10px 12px;

  background:#161b22;

  border:1px solid #30363d;
  border-radius:10px;

  font-size:13px;
  line-height:1.7;
}

.good{
  color:#7ee787;
}

.clean{
  color:#58a6ff;
}

</style>
</head>

<body>

<div id="app">

<h1>🧙 Mage Idle — P0.3A-3</h1>

<div id="sub">
Clean Frame 動畫測試
</div>


<div id="status">

目前方向：
<span id="action">載入中...</span>

<br>

動畫 Frame：
<span id="frame">-</span>

<br>

Sprite：
<span id="size">等待圖片</span>

</div>


<div id="game">

  <div id="mage">

    <div id="shadow"></div>

    <div id="spriteWindow">

      <img
        id="sprite"
        src="31C9D3E8-52BE-4F63-B558-198195F25DD7.png"
        alt=""
      >

    </div>

  </div>

</div>


<div id="controls">

<button id="pause">
暫停
</button>

<button id="restart">
重新開始
</button>

</div>


<div id="info">

<div class="good">
✓ P0.3 動畫架構
</div>

<div class="good">
✓ Down / Left / Right / Up
</div>

<div class="clean">
✓ Clean Frame 安全裁切
</div>

<div class="clean">
✓ 使用圖片真正尺寸計算
</div>

<div>
↓ → ← → → → ↑ 自動循環
</div>

<div>
🔒 P0.2B-4 Safety Anchor
</div>

</div>

</div>


<script>

/* ======================================
   P0.3A-3 CLEAN FRAME
====================================== */

const game =
document.getElementById("game");

const mage =
document.getElementById("mage");

const sprite =
document.getElementById("sprite");

const spriteWindow =
document.getElementById("spriteWindow");

const actionText =
document.getElementById("action");

const frameText =
document.getElementById("frame");

const sizeText =
document.getElementById("size");

const pauseButton =
document.getElementById("pause");

const restartButton =
document.getElementById("restart");


/* ======================================
   SPRITE CONFIG
====================================== */

const COLS = 9;

const ROWS = 5;


/*
  每格在遊戲中的基準尺寸。
*/

const CELL = 100;


/*
  安全裁切。

  每一格四周各吃掉2px。

  所以實際可見：
  96 × 96
*/

const SAFE = 2;


const ROW = {

  idle:0,

  down:1,

  left:2,

  right:3,

  up:4

};


let spriteReady = false;


/*
  真實圖片資訊。
*/

let naturalWidth = 0;

let naturalHeight = 0;

let sourceCellWidth = 0;

let sourceCellHeight = 0;


/* ======================================
   IMAGE LOAD
====================================== */

sprite.onload = function(){

  naturalWidth =
    sprite.naturalWidth;

  naturalHeight =
    sprite.naturalHeight;


  /*
    真實來源格尺寸。

    例如目前錄影看到：

    1663 × 946

    這裡不再寫死。
  */

  sourceCellWidth =
    naturalWidth / COLS;

  sourceCellHeight =
    naturalHeight / ROWS;


  sizeText.textContent =

    naturalWidth +
    " × " +
    naturalHeight;


  /*
    將來源的每一格縮放成
    100 × 100。

    整張圖片因此變成：

    900 × 500
  */

  sprite.style.width =
    (COLS * CELL) + "px";

  sprite.style.height =
    (ROWS * CELL) + "px";


  spriteReady = true;


  resetGame();

};


sprite.onerror = function(){

  actionText.textContent =
    "❌ 圖片載入失敗";

};


/* ======================================
   FRAME
====================================== */

function setFrame(row,frame){

  if(!spriteReady){
    return;
  }


  frame =
    Math.max(
      0,
      Math.min(
        COLS - 1,
        frame
      )
    );


  row =
    Math.max(
      0,
      Math.min(
        ROWS - 1,
        row
      )
    );


  /*
    CELL = 100

    正常第1格：
    0

    正常第2格：
    -100

    Clean Frame：

    再往左/上移SAFE，
    讓窗口不顯示格子邊緣。
  */

  const x =
    -(frame * CELL) -
    SAFE;


  const y =
    -(row * CELL) -
    SAFE;


  sprite.style.left =
    x + "px";


  sprite.style.top =
    y + "px";


  frameText.textContent =
    (frame + 1) +
    " / 9";

}


/* ======================================
   PLAYER
====================================== */

const player = {

  x:0,

  y:0,

  speed:65,

  direction:"down",

  frame:0,

  frameTimer:0,

  frameSpeed:130

};


/* ======================================
   PHASES
====================================== */

const phases = [

  {
    label:"↓ Down",
    direction:"down",
    row:ROW.down
  },

  {
    label:"← Left",
    direction:"left",
    row:ROW.left
  },

  {
    label:"→ Right",
    direction:"right",
    row:ROW.right
  },

  {
    label:"↑ Up",
    direction:"up",
    row:ROW.up
  }

];


let phase = 0;

let phaseTimer = 0;


const PHASE_LENGTH =
2000;


/* ======================================
   STATE
====================================== */

let paused = false;

let lastTime =
performance.now();


/* ======================================
   RESET
====================================== */

function resetGame(){

  player.x =
    game.clientWidth / 2;


  player.y =
    game.clientHeight / 2;


  player.direction =
    "down";


  player.frame =
    0;


  player.frameTimer =
    0;


  phase =
    0;


  phaseTimer =
    0;


  actionText.textContent =
    phases[0].label;


  setFrame(
    phases[0].row,
    0
  );


  draw();

}


/* ======================================
   NEXT PHASE
====================================== */

function nextPhase(){

  phase++;


  if(
    phase >=
    phases.length
  ){

    phase =
      0;


    /*
      每跑完一輪回中央。
    */

    player.x =
      game.clientWidth / 2;


    player.y =
      game.clientHeight / 2;

  }


  player.direction =
    phases[phase].direction;


  player.frame =
    0;


  player.frameTimer =
    0;


  actionText.textContent =
    phases[phase].label;

}


/* ======================================
   MOVEMENT
====================================== */

function updateMovement(dt){

  const move =

    player.speed *
    dt /
    1000;


  switch(
    player.direction
  ){

    case "down":

      player.y +=
        move;

      break;


    case "up":

      player.y -=
        move;

      break;


    case "left":

      player.x -=
        move;

      break;


    case "right":

      player.x +=
        move;

      break;

  }


  player.x =

    Math.max(

      60,

      Math.min(

        game.clientWidth -
        60,

        player.x

      )

    );


  player.y =

    Math.max(

      100,

      Math.min(

        game.clientHeight -
        40,

        player.y

      )

    );

}


/* ======================================
   ANIMATION
====================================== */

function updateAnimation(dt){

  player.frameTimer +=
    dt;


  if(
    player.frameTimer >=
    player.frameSpeed
  ){

    /*
      保留超出的時間，
      動畫會比直接歸零更穩。
    */

    player.frameTimer -=
      player.frameSpeed;


    player.frame =

      (
        player.frame +
        1
      ) %
      COLS;

  }


  setFrame(

    phases[phase].row,

    player.frame

  );

}


/* ======================================
   DRAW
====================================== */

function draw(){

  mage.style.left =
    player.x +
    "px";


  mage.style.top =
    player.y +
    "px";

}


/* ======================================
   UPDATE
====================================== */

function update(dt){

  phaseTimer +=
    dt;


  if(
    phaseTimer >=
    PHASE_LENGTH
  ){

    phaseTimer -=
      PHASE_LENGTH;


    nextPhase();

  }


  updateMovement(dt);

  updateAnimation(dt);

  draw();

}


/* ======================================
   BUTTONS
====================================== */

pauseButton.onclick =
function(){

  paused =
    !paused;


  pauseButton.textContent =

    paused
    ?
    "繼續"
    :
    "暫停";

};


restartButton.onclick =
function(){

  resetGame();

};


/* ======================================
   LOOP
====================================== */

function loop(now){

  const dt =

    Math.min(

      50,

      now -
      lastTime

    );


  lastTime =
    now;


  if(
    spriteReady &&
    !paused
  ){

    update(dt);

  }


  requestAnimationFrame(
    loop
  );

}


requestAnimationFrame(
  loop
);

</script>

</body>
</html>
