<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mage Idle - P0.2C-R2</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#10141c;
  color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:12px;
}

h2{
  margin:4px 0 10px;
  font-size:20px;
}

#topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

#stats{
  font-size:13px;
  line-height:1.55;
}

button{
  border:0;
  border-radius:9px;
  padding:9px 14px;
  background:#34445f;
  color:white;
  font-weight:700;
}

#game{
  position:relative;
  width:100%;
  height:520px;
  overflow:hidden;

  border:2px solid #4c6646;
  border-radius:12px;

  background:
  radial-gradient(circle at 20% 30%,
  rgba(255,255,255,.06) 0 2px,
  transparent 3px),

  radial-gradient(circle at 70% 70%,
  rgba(0,0,0,.08) 0 3px,
  transparent 4px),

  linear-gradient(#638f52,#527c45);
}


/* ================================
   MAGE
================================ */

#mage{
  position:absolute;

  width:83px;
  height:78px;

  transform:translate(-50%,-50%);

  z-index:20;

  pointer-events:none;
}


/*
==================================
P0.2C-R2

原圖：
1536 × 1024

角色資料區從約 X=170 開始。

每格原始寬度：
約 150px

每格原始高度：
約 110px

顯示倍率：
55%

150 × .55 = 82.5
110 × .55 = 60.5
==================================
*/

#mageSprite{

  position:absolute;

  left:0;
  top:0;

  width:83px;
  height:61px;

  overflow:hidden;

  background-image:
  url("29E84ABB-2A8C-49FA-99D5-43D4867A6615.png");

  background-repeat:no-repeat;

  /*
  1536 × .55
  1024 × .55
  */

  background-size:
  844.8px 563.2px;

  background-position:
  -93.5px 0px;

  filter:
  drop-shadow(
    0 3px 2px
    rgba(0,0,0,.35)
  );
}


/* ================================
   HP
================================ */

.hp{
  position:absolute;

  height:6px;

  background:#321;

  border:
  1px solid rgba(0,0,0,.7);

  border-radius:4px;

  overflow:hidden;
}

.hp span{
  display:block;

  width:100%;
  height:100%;

  background:#e55353;
}

#mage .hp{
  left:7px;
  right:7px;
  bottom:2px;
}


/* ================================
   SLIME
================================ */

.slime{
  position:absolute;

  width:44px;
  height:48px;

  transform:
  translate(-50%,-50%);

  text-align:center;

  z-index:10;
}

.slimeIcon{
  font-size:31px;
  line-height:34px;

  filter:
  drop-shadow(
    0 2px 2px
    rgba(0,0,0,.35)
  );
}

.slime .hp{
  left:2px;
  right:2px;
  bottom:0;
}


/* ================================
   TARGET
================================ */

.targetRing{

  position:absolute;

  width:50px;
  height:24px;

  border:
  2px solid rgba(255,230,90,.8);

  border-radius:50%;

  transform:
  translate(-50%,-50%);

  z-index:5;
}


/* ================================
   SPELL
================================ */

.spell{

  position:absolute;

  transform:
  translate(-50%,-50%);

  z-index:40;

  font-size:26px;

  pointer-events:none;

  animation:
  spellPop .45s ease-out forwards;
}

@keyframes spellPop{

  0%{
    opacity:0;

    transform:
    translate(-50%,-50%)
    scale(.5);
  }

  40%{
    opacity:1;

    transform:
    translate(-50%,-75%)
    scale(1.3);
  }

  100%{
    opacity:0;

    transform:
    translate(-50%,-120%)
    scale(.8);
  }
}


.damage{

  position:absolute;

  transform:
  translate(-50%,-50%);

  z-index:50;

  font-size:13px;

  font-weight:800;

  color:white;

  text-shadow:
  0 1px 3px black;

  pointer-events:none;

  animation:
  damageFloat .7s forwards;
}

@keyframes damageFloat{

  from{
    opacity:1;
  }

  to{
    opacity:0;

    transform:
    translate(-50%,-110%);
  }
}


/* ================================
   PANEL
================================ */

#panel{

  margin-top:10px;

  background:#181e29;

  border-radius:10px;

  padding:10px;
}

#skillDisplay{

  font-size:14px;

  margin-bottom:7px;
}

#log{

  height:105px;

  overflow:auto;

  font-size:12px;

  line-height:1.5;

  color:#bdc6d6;
}

.debug{
  color:#8ee29a;
  font-weight:700;
}

</style>
</head>


<body>

<div id="app">

<h2>
⚔️ Mage Idle — P0.2C-R2
</h2>


<div id="topbar">

<div id="stats">

Lv.<span id="level">1</span>

｜ EXP
<span id="exp">0</span>/<span id="expNeed">100</span>

｜ 擊殺
<span id="kills">0</span>

<br>

HP
<span id="hpText">100</span>/100

｜ 狀態
<span id="stateText">尋找目標</span>

</div>


<button id="pauseBtn">
暫停
</button>

</div>


<div id="game">

<div id="mage">

<div id="mageSprite"></div>

<div class="hp">
<span id="mageHp"></span>
</div>

</div>

</div>


<div id="panel">

<div id="skillDisplay">

下一技能：

<strong id="nextSkill">
🔥 Fire
</strong>

</div>


<div id="log">

<div class="debug">
P0.2C-R2 ATLAS CALIBRATION
</div>

<div>
🔒 P0.2B-4 CORE
</div>

<div>
✨ TRUE 4-DIRECTION CAST
</div>

</div>

</div>

</div>


<script>

/* ================================
DOM
================================ */

const game =
document.getElementById("game");

const mageEl =
document.getElementById("mage");

const mageSprite =
document.getElementById("mageSprite");

const hpText =
document.getElementById("hpText");

const mageHp =
document.getElementById("mageHp");

const levelEl =
document.getElementById("level");

const expEl =
document.getElementById("exp");

const expNeedEl =
document.getElementById("expNeed");

const killsEl =
document.getElementById("kills");

const stateText =
document.getElementById("stateText");

const nextSkill =
document.getElementById("nextSkill");

const pauseBtn =
document.getElementById("pauseBtn");

const logEl =
document.getElementById("log");


/* ================================
GAME
================================ */

let paused=false;

let lastTime=
performance.now();

let level=1;

let exp=0;

let expNeed=100;

let kills=0;


/* ================================
P0.2C-R2 ATLAS
================================ */

/*

原圖：
1536 × 1024

縮放倍率：
0.55

原始角色區起點：
X ≈ 170

原始格子：
150 × 110

縮放後：

X起點：
170 × .55 = 93.5

X步距：
150 × .55 = 82.5

Y步距：
110 × .55 = 60.5

*/

const ATLAS={

  baseX:-93.5,

  stepX:82.5,

  rows:{

    idle:0,

    down:-60.5,

    left:-121,

    right:-181.5,

    up:-242,

    castDown:-302.5,

    castLeft:-363,

    castRight:-423.5,

    castUp:-484

  }

};


/* ================================
SPRITE
================================ */

function setSprite(row,frame){

  frame=
  Math.max(
    0,
    Math.min(
      8,
      frame
    )
  );


  const x=
  ATLAS.baseX-
  frame*
  ATLAS.stepX;


  mageSprite.style
  .backgroundPosition=

  x+"px "+row+"px";

}


/* ================================
MAGE
================================ */

const mage={

  x:0,
  y:0,

  hp:100,
  maxHp:100,

  speed:70,

  target:null,

  direction:"down",

  lockedDirection:"down",

  facingLocked:false,

  frame:0,

  frameTimer:0,

  casting:false,

  castStart:0,

  castDuration:720,

  castSkill:null,

  castTarget:null,

  castHit:false,

  skillIndex:0,

  lastAttack:0
};


/* ================================
SKILLS
================================ */

const skills=[

{
  name:"🔥 Fire",
  icon:"🔥",

  range:145,

  damage:10,

  cooldown:1000
},

{
  name:"⚡ Lightning",
  icon:"⚡",

  range:145,

  damage:10,

  cooldown:1000
},

{
  name:"❄️ Ice",
  icon:"❄️",

  range:48,

  damage:7,

  cooldown:650
}

];


/* ================================
HELPERS
================================ */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}


function directionToTarget(target){

  const dx=
  target.x-mage.x;

  const dy=
  target.y-mage.y;


  const angle=
  Math.atan2(
    dy,
    dx
  )*
  180/Math.PI;


  if(
    angle>=-45 &&
    angle<45
  )
    return "right";


  if(
    angle>=45 &&
    angle<135
  )
    return "down";


  if(
    angle>=-135 &&
    angle<-45
  )
    return "up";


  return "left";
}


/* ================================
SLIME
================================ */

const slimes=[];


function createSlime(id){

  const el=
  document.createElement(
    "div"
  );


  el.className=
  "slime";


  el.innerHTML=

  `<div class="slimeIcon">
  🟢
  </div>

  <div class="hp">
  <span></span>
  </div>`;


  game.appendChild(el);


  const slime={

    id:id,

    x:0,
    y:0,

    hp:50,
    maxHp:50,

    attack:5,

    alive:true,

    respawnAt:0,

    lastAttack:0,

    el:el,

    hpEl:
    el.querySelector(
      ".hp span"
    )
  };


  slimes.push(slime);


  respawnSlime(slime);

}


function respawnSlime(slime){

  slime.x=
  35+
  Math.random()*
  Math.max(
    10,
    game.clientWidth-70
  );


  slime.y=
  40+
  Math.random()*
  Math.max(
    10,
    game.clientHeight-90
  );


  slime.hp=
  slime.maxHp;


  slime.alive=true;


  slime.el.style.display=
  "block";


  updateSlime(slime);

}


function updateSlime(slime){

  slime.el.style.left=
  slime.x+"px";


  slime.el.style.top=
  slime.y+"px";


  slime.hpEl.style.width=

  (
    slime.hp/
    slime.maxHp*
    100
  )+"%";

}


/* ================================
TARGET RING
================================ */

const targetRing=
document.createElement(
  "div"
);

targetRing.className=
"targetRing";

targetRing.style.display=
"none";

game.appendChild(
  targetRing
);


/* ================================
TARGET
================================ */

function findTarget(){

  let best=null;

  let bestDistance=
  Infinity;


  for(
    const slime
    of slimes
  ){

    if(!slime.alive)
      continue;


    const d=
    distance(
      mage,
      slime
    );


    if(
      d<
      bestDistance
    ){

      best=
      slime;

      bestDistance=
      d;

    }

  }


  mage.target=
  best;


  mage.facingLocked=
  false;

}


/* ================================
FACING LOCK
================================ */

function lockFacing(){

  if(!mage.target)
    return;


  mage.direction=
  directionToTarget(
    mage.target
  );


  mage.lockedDirection=
  mage.direction;


  mage.facingLocked=
  true;

}


/* ================================
ROW HELPERS
================================ */

function movementRow(direction){

  switch(direction){

    case "left":
      return ATLAS.rows.left;

    case "right":
      return ATLAS.rows.right;

    case "up":
      return ATLAS.rows.up;

    default:
      return ATLAS.rows.down;
  }

}


function castRow(direction){

  switch(direction){

    case "left":
      return ATLAS.rows.castLeft;

    case "right":
      return ATLAS.rows.castRight;

    case "up":
      return ATLAS.rows.castUp;

    default:
      return ATLAS.rows.castDown;
  }

}


/* ================================
WALK
================================ */

function walkAnimation(dt){

  mage.frameTimer+=dt;


  if(
    mage.frameTimer>=125
  ){

    mage.frameTimer=0;


    mage.frame=
    (
      mage.frame+1
    )%9;

  }


  setSprite(

    movementRow(
      mage.direction
    ),

    mage.frame

  );

}


/* ================================
IDLE
================================ */

function idleAnimation(dt){

  mage.frameTimer+=dt;


  if(
    mage.frameTimer>=220
  ){

    mage.frameTimer=0;


    mage.frame=
    (
      mage.frame+1
    )%9;

  }


  setSprite(
    ATLAS.rows.idle,
    mage.frame
  );

}


/* ================================
CAST START
================================ */

function startCast(
  skill,
  now
){

  if(
    mage.casting ||
    !mage.target
  )
    return;


  /*
  施法開始前
  最後一次確認怪物方向。
  */

  lockFacing();


  mage.casting=true;


  mage.castStart=
  now;


  mage.castSkill=
  skill;


  mage.castTarget=
  mage.target;


  mage.castHit=
  false;


  mage.frame=0;


  mage.frameTimer=0;


  stateText.textContent=
  "施法中";

}


/* ================================
CAST
================================ */

function castAnimation(now){

  const elapsed=
  now-
  mage.castStart;


  const frame=
  Math.min(
    8,

    Math.floor(

      elapsed/

      (
        mage.castDuration/
        9
      )

    )
  );


  /*
  真正四方向 Cast
  */

  setSprite(

    castRow(
      mage.lockedDirection
    ),

    frame

  );


  /*
  中段造成傷害
  */

  if(
    elapsed>=360 &&
    !mage.castHit
  ){

    mage.castHit=true;


    applySpell();

  }


  /*
  Cast 完成
  */

  if(
    elapsed>=
    mage.castDuration
  ){

    mage.casting=false;


    mage.castSkill=null;


    mage.castTarget=null;


    mage.frame=0;


    mage.frameTimer=0;


    stateText.textContent=
    "鎖定攻擊";

  }

}


/* ================================
SPELL
================================ */

function applySpell(){

  const target=
  mage.castTarget;


  const skill=
  mage.castSkill;


  if(
    !target ||
    !target.alive ||
    !skill
  )
    return;


  target.hp-=
  skill.damage;


  showSpell(
    target,
    skill
  );


  showDamage(
    target,
    skill.damage
  );


  addLog(

    skill.name+

    " → Slime -"+

    skill.damage

  );


  if(
    target.hp<=0
  ){

    target.hp=0;


    updateSlime(
      target
    );


    killSlime(
      target
    );

  }

  else{

    updateSlime(
      target
    );

  }

}


/* ================================
EFFECT
================================ */

function showSpell(
  target,
  skill
){

  const el=
  document.createElement(
    "div"
  );


  el.className=
  "spell";


  el.textContent=
  skill.icon;


  el.style.left=
  target.x+"px";


  el.style.top=
  (
    target.y-15
  )+"px";


  game.appendChild(el);


  setTimeout(
    ()=>el.remove(),
    450
  );

}


function showDamage(
  target,
  value
){

  const el=
  document.createElement(
    "div"
  );


  el.className=
  "damage";


  el.textContent=
  "-"+value;


  el.style.left=
  target.x+"px";


  el.style.top=
  (
    target.y-25
  )+"px";


  game.appendChild(el);


  setTimeout(
    ()=>el.remove(),
    700
  );

}


/* ================================
KILL
================================ */

function killSlime(slime){

  slime.alive=false;


  slime.el.style.display=
  "none";


  slime.respawnAt=
  performance.now()+
  5000;


  kills++;


  exp+=10;


  addLog(
    "🟢 Slime 擊倒！ +10 EXP"
  );


  if(
    exp>=expNeed
  ){

    exp-=
    expNeed;


    level++;


    expNeed=
    Math.floor(
      expNeed*
      1.25
    );


    addLog(
      "✨ 升級！ Lv."+
      level
    );

  }


  mage.target=null;


  mage.facingLocked=false;

}


/* ================================
ATTACK
================================ */

function attack(now){

  if(
    !mage.target ||
    mage.casting
  )
    return;


  const skill=
  skills[
    mage.skillIndex
  ];


  if(
    now-
    mage.lastAttack<
    skill.cooldown
  )
    return;


  mage.lastAttack=
  now;


  startCast(
    skill,
    now
  );


  mage.skillIndex=
  (
    mage.skillIndex+1
  )%
  skills.length;


  nextSkill.textContent=
  skills[
    mage.skillIndex
  ].name;

}


/* ================================
AI
================================ */

function updateMage(
  dt,
  now
){

  if(
    !mage.target ||
    !mage.target.alive
  ){

    findTarget();

  }


  if(
    !mage.target
  ){

    stateText.textContent=
    "等待怪物";


    idleAnimation(dt);


    return;

  }


  /*
  施法期間：

  不移動
  不轉向
  */

  if(
    mage.casting
  ){

    stateText.textContent=
    "施法中";


    castAnimation(now);


    return;

  }


  const target=
  mage.target;


  const dx=
  target.x-
  mage.x;


  const dy=
  target.y-
  mage.y;


  const d=
  Math.hypot(
    dx,
    dy
  );


  const skill=
  skills[
    mage.skillIndex
  ];


  /*
  MOVE
  */

  if(
    d>
    skill.range
  ){

    mage.facingLocked=
    false;


    mage.direction=
    directionToTarget(
      target
    );


    stateText.textContent=
    "追蹤目標";


    const step=
    mage.speed*
    dt/
    1000;


    mage.x+=
    dx/d*
    Math.min(
      step,
      d
    );


    mage.y+=
    dy/d*
    Math.min(
      step,
      d
    );


    walkAnimation(dt);

  }


  /*
  COMBAT
  */

  else{

    if(
      !mage.facingLocked
    ){

      lockFacing();

    }


    stateText.textContent=
    "鎖定攻擊";


    /*
    等待 CD 時
    維持目前面向。
    */

    setSprite(

      movementRow(
        mage.lockedDirection
      ),

      0

    );


    attack(now);

  }


  mage.x=
  Math.max(
    42,

    Math.min(
      game.clientWidth-42,
      mage.x
    )
  );


  mage.y=
  Math.max(
    45,

    Math.min(
      game.clientHeight-45,
      mage.y
    )
  );

}


/* ================================
ENEMY ATTACK
================================ */

function enemyAttack(now){

  for(
    const slime
    of slimes
  ){

    if(
      !slime.alive
    )
      continue;


    if(
      distance(
        mage,
        slime
      )>52
    )
      continue;


    if(
      now-
      slime.lastAttack<
      1000
    )
      continue;


    slime.lastAttack=
    now;


    mage.hp-=
    slime.attack;


    if(
      mage.hp<=0
    ){

      addLog(
        "💀 Mage 倒下，返回起點"
      );


      mage.hp=
      mage.maxHp;


      mage.x=
      game.clientWidth/
      2;


      mage.y=
      game.clientHeight-
      70;


      mage.target=
      null;


      mage.casting=
      false;


      mage.facingLocked=
      false;


      mage.direction=
      "down";


      mage.lockedDirection=
      "down";


      break;

    }

  }

}


/* ================================
RESPAWN
================================ */

function updateRespawns(now){

  for(
    const slime
    of slimes
  ){

    if(
      !slime.alive &&
      now>=
      slime.respawnAt
    ){

      respawnSlime(
        slime
      );


      addLog(
        "🟢 Slime 重生"
      );

    }

  }

}


/* ================================
VISUAL
================================ */

function updateVisual(){

  mageEl.style.left=
  mage.x+"px";


  mageEl.style.top=
  mage.y+"px";


  if(
    mage.target &&
    mage.target.alive
  ){

    targetRing.style.display=
    "block";


    targetRing.style.left=
    mage.target.x+"px";


    targetRing.style.top=
    (
      mage.target.y+
      14
    )+"px";

  }

  else{

    targetRing.style.display=
    "none";

  }

}


/* ================================
HUD
================================ */

function updateHUD(){

  hpText.textContent=
  mage.hp;


  mageHp.style.width=
  (
    mage.hp/
    mage.maxHp*
    100
  )+"%";


  levelEl.textContent=
  level;


  expEl.textContent=
  exp;


  expNeedEl.textContent=
  expNeed;


  killsEl.textContent=
  kills;

}


/* ================================
LOG
================================ */

function addLog(text){

  const div=
  document.createElement(
    "div"
  );


  div.textContent=
  text;


  logEl.appendChild(
    div
  );


  while(
    logEl.children.length>
    30
  ){

    logEl.removeChild(
      logEl.children[1]
    );

  }


  logEl.scrollTop=
  logEl.scrollHeight;

}


/* ================================
LOOP
================================ */

function loop(now){

  const dt=
  Math.min(
    50,
    now-lastTime
  );


  lastTime=
  now;


  if(
    !paused
  ){

    updateRespawns(
      now
    );


    updateMage(
      dt,
      now
    );


    enemyAttack(
      now
    );


    updateVisual();


    updateHUD();

  }


  requestAnimationFrame(
    loop
  );

}


/* ================================
PAUSE
================================ */

pauseBtn.onclick=
()=>{

  paused=
  !paused;


  pauseBtn.textContent=

  paused
  ?"繼續"
  :"暫停";

};


/* ================================
START
================================ */

function start(){

  mage.x=
  game.clientWidth/
  2;


  mage.y=
  game.clientHeight-
  70;


  for(
    let i=0;
    i<8;
    i++
  ){

    createSlime(i);

  }


  setSprite(
    ATLAS.rows.idle,
    0
  );


  updateVisual();


  updateHUD();


  addLog(
    "✅ P0.2C-R2 啟動"
  );


  addLog(
    "📐 Atlas 1536 × 1024"
  );


  addLog(
    "🔒 P0.2B-4 CORE"
  );


  addLog(
    "✨ 4-Direction Cast"
  );


  requestAnimationFrame(
    loop
  );

}


start();

</script>
