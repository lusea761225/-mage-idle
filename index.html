<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mage Idle P0.3A-4</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  background:#0d1117;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  padding:12px;
}

#app{
  max-width:760px;
  margin:auto;
}

h1{
  margin:5px 0;
  font-size:22px;
}

#sub{
  color:#8b949e;
  font-size:13px;
  margin-bottom:10px;
}

#status{
  background:#161b22;
  border:1px solid #30363d;
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:10px;
  line-height:1.8;
  font-size:14px;
}

#action{
  color:#58a6ff;
  font-weight:bold;
}

#frame{
  color:#7ee787;
  font-weight:bold;
}

#loadStatus{
  color:#f2cc60;
}

/* =========================
   MAP
========================= */

#game{
  position:relative;

  width:100%;
  height:520px;

  overflow:hidden;

  border:2px solid #42643b;
  border-radius:14px;

  background:
    radial-gradient(
      circle at 20% 25%,
      rgba(255,255,255,.07) 0 3px,
      transparent 4px
    ),
    radial-gradient(
      circle at 75% 70%,
      rgba(0,0,0,.08) 0 4px,
      transparent 5px
    ),
    linear-gradient(
      #699957,
      #527c46
    );
}

/* =========================
   PLAYER
========================= */

#mage{
  position:absolute;

  width:110px;
  height:120px;

  transform:translate(-50%,-85%);

  pointer-events:none;

  z-index:10;
}

#shadow{
  position:absolute;

  width:46px;
  height:12px;

  left:50%;
  bottom:8px;

  transform:translateX(-50%);

  border-radius:50%;

  background:rgba(0,0,0,.25);
}

/*
  每張方向圖只有3幀。

  顯示窗口只負責顯示其中1幀。
*/

#spriteWindow{
  position:absolute;

  width:100px;
  height:100px;

  left:5px;
  bottom:13px;

  overflow:hidden;
}

/*
  圖片永遠縮放成：

  300px × 100px

  所以：

  Frame 1 = 0
  Frame 2 = -100
  Frame 3 = -200
*/

#sprite{
  position:absolute;

  left:0;
  top:0;

  width:300px;
  height:100px;

  max-width:none;

  pointer-events:none;
  user-select:none;

  object-fit:fill;
}

/* =========================
   BUTTONS
========================= */

#controls{
  display:flex;
  gap:8px;
  margin-top:10px;
}

button{
  flex:1;

  padding:11px;

  border:0;
  border-radius:9px;

  background:#30363d;
  color:#fff;

  font-size:14px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

#info{
  margin-top:10px;

  padding:10px 12px;

  background:#161b22;

  border:1px solid #30363d;
  border-radius:10px;

  font-size:13px;
  line-height:1.8;
}

.good{
  color:#7ee787;
}

.new{
  color:#58a6ff;
}

</style>
</head>

<body>

<div id="app">

<h1>🧙 Mage Idle — P0.3A-4</h1>

<div id="sub">
Independent Animation Strip Test
</div>

<div id="status">

目前方向：
<span id="action">載入中...</span>

<br>

動畫 Frame：
<span id="frame">-</span>

<br>

素材：
<span id="loadStatus">載入中...</span>

</div>


<div id="game">

  <div id="mage">

    <div id="shadow"></div>

    <div id="spriteWindow">

      <img
        id="sprite"
        alt=""
      >

    </div>

  </div>

</div>


<div id="controls">

<button id="pause">
暫停
</button>

<button id="restart">
重新開始
</button>

</div>


<div id="info">

<div class="new">
★ P0.3A-4 新架構
</div>

<div class="good">
✓ 四方向使用四張獨立素材
</div>

<div class="good">
✓ 每個方向只有3個Frame
</div>

<div class="good">
✓ 不再使用9×5 Sprite Atlas
</div>

<div class="good">
✓ 不再計算 Row
</div>

<div>
測試：↓ → ← → → → ↑
</div>

<div>
🔒 P0.2B-4 Safety Anchor
</div>

</div>

</div>


<script>

/* =====================================
   P0.3A-4

   INDEPENDENT DIRECTION STRIPS
===================================== */


/* =====================================
   DOM
===================================== */

const game =
document.getElementById("game");

const mage =
document.getElementById("mage");

const sprite =
document.getElementById("sprite");

const actionText =
document.getElementById("action");

const frameText =
document.getElementById("frame");

const loadStatus =
document.getElementById("loadStatus");

const pauseButton =
document.getElementById("pause");

const restartButton =
document.getElementById("restart");


/* =====================================
   ASSETS

   四個方向完全分開。
===================================== */

const ASSETS = {

  down:
  "06466AC9-5FD2-4A22-86AC-DFC8AEAD9A13.png",

  left:
  "EB51F3E3-D18E-4AB0-B2C4-506E861C063E.png",

  right:
  "AAE68541-E5B4-47C2-804F-AE34916AE464.png",

  up:
  "777B5A50-9583-4181-AD02-6A7AC73F6D4B.png"

};


/* =====================================
   PRELOAD

   先把四張全部載入。

   避免換方向時閃一下。
===================================== */

const cache = {};

let loadedCount = 0;

let ready = false;


Object.keys(ASSETS).forEach(

  function(direction){

    const img =
      new Image();


    img.onload =
    function(){

      loadedCount++;


      loadStatus.textContent =

        loadedCount +
        " / 4";


      if(
        loadedCount === 4
      ){

        ready = true;

        loadStatus.textContent =
          "✓ 4 / 4";


        resetGame();

      }

    };


    img.onerror =
    function(){

      loadStatus.textContent =
        "❌ " + direction + " 載入失敗";

    };


    img.src =
      ASSETS[direction];


    cache[direction] =
      img;

  }

);


/* =====================================
   PLAYER
===================================== */

const player = {

  x:0,

  y:0,

  direction:"down",

  speed:65,

  frame:0,

  frameTimer:0,

  frameSpeed:180

};


/* =====================================
   PHASES
===================================== */

const phases = [

  {
    direction:"down",
    label:"↓ Down"
  },

  {
    direction:"left",
    label:"← Left"
  },

  {
    direction:"right",
    label:"→ Right"
  },

  {
    direction:"up",
    label:"↑ Up"
  }

];


let phase = 0;

let phaseTimer = 0;


/*
  每個方向2.2秒。
*/

const PHASE_LENGTH =
2200;


/* =====================================
   GAME STATE
===================================== */

let paused = false;

let lastTime =
performance.now();


/* =====================================
   CHANGE DIRECTION IMAGE
===================================== */

function setDirection(
  direction
){

  player.direction =
    direction;


  /*
    關鍵：

    換方向 = 換圖片。

    完全沒有Row計算。
  */

  sprite.src =
    ASSETS[direction];


  player.frame =
    0;


  player.frameTimer =
    0;


  setFrame(0);

}


/* =====================================
   SET FRAME
===================================== */

function setFrame(
  frame
){

  frame =
    Math.max(
      0,
      Math.min(
        2,
        frame
      )
    );


  /*
    一張圖：

    300 × 100

    每格：

    100 × 100
  */

  sprite.style.left =

    -(frame * 100) +
    "px";


  frameText.textContent =

    (frame + 1) +
    " / 3";

}


/* =====================================
   RESET
===================================== */

function resetGame(){

  player.x =
    game.clientWidth / 2;


  player.y =
    game.clientHeight / 2;


  phase =
    0;


  phaseTimer =
    0;


  actionText.textContent =
    phases[0].label;


  setDirection(
    phases[0].direction
  );


  draw();

}


/* =====================================
   NEXT PHASE
===================================== */

function nextPhase(){

  phase++;


  if(
    phase >=
    phases.length
  ){

    phase =
      0;


    /*
      一輪結束回中央。
    */

    player.x =
      game.clientWidth / 2;


    player.y =
      game.clientHeight / 2;

  }


  const next =
    phases[phase];


  actionText.textContent =
    next.label;


  setDirection(
    next.direction
  );

}


/* =====================================
   MOVEMENT
===================================== */

function updateMovement(
  dt
){

  const move =

    player.speed *
    dt /
    1000;


  switch(
    player.direction
  ){

    case "down":

      player.y +=
        move;

      break;


    case "up":

      player.y -=
        move;

      break;


    case "left":

      player.x -=
        move;

      break;


    case "right":

      player.x +=
        move;

      break;

  }


  player.x =

    Math.max(

      60,

      Math.min(

        game.clientWidth -
        60,

        player.x

      )

    );


  player.y =

    Math.max(

      100,

      Math.min(

        game.clientHeight -
        40,

        player.y

      )

    );

}


/* =====================================
   ANIMATION
===================================== */

function updateAnimation(
  dt
){

  player.frameTimer +=
    dt;


  if(
    player.frameTimer >=
    player.frameSpeed
  ){

    player.frameTimer -=
      player.frameSpeed;


    player.frame =

      (
        player.frame +
        1
      ) % 3;


    setFrame(
      player.frame
    );

  }

}


/* =====================================
   DRAW
===================================== */

function draw(){

  mage.style.left =
    player.x +
    "px";


  mage.style.top =
    player.y +
    "px";

}


/* =====================================
   UPDATE
===================================== */

function update(
  dt
){

  phaseTimer +=
    dt;


  if(
    phaseTimer >=
    PHASE_LENGTH
  ){

    phaseTimer -=
      PHASE_LENGTH;


    nextPhase();

  }


  updateMovement(
    dt
  );


  updateAnimation(
    dt
  );


  draw();

}


/* =====================================
   BUTTONS
===================================== */

pauseButton.onclick =
function(){

  paused =
    !paused;


  pauseButton.textContent =

    paused
    ?
    "繼續"
    :
    "暫停";

};


restartButton.onclick =
function(){

  resetGame();

};


/* =====================================
   LOOP
===================================== */

function loop(
  now
){

  const dt =

    Math.min(

      50,

      now -
      lastTime

    );


  lastTime =
    now;


  if(
    ready &&
    !paused
  ){

    update(
      dt
    );

  }


  requestAnimationFrame(
    loop
  );

}


requestAnimationFrame(
  loop
);

</script>

</body>
</html>
