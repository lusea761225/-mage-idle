<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mage Idle - P0.2C-R1</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#10141c;
  color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app{
  max-width:760px;
  margin:auto;
  padding:12px;
}

h2{
  margin:4px 0 10px;
  font-size:20px;
}

#topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

#stats{
  font-size:13px;
  line-height:1.55;
}

button{
  border:0;
  border-radius:9px;
  padding:9px 14px;
  background:#34445f;
  color:#fff;
  font-weight:bold;
}

#game{
  position:relative;
  height:520px;
  overflow:hidden;
  border:2px solid #4c6646;
  border-radius:12px;
  background:linear-gradient(#638f52,#527c45);
}

#mage{
  position:absolute;
  width:84px;
  height:96px;
  transform:translate(-50%,-50%);
  z-index:20;
  pointer-events:none;
}

/*
  新 Atlas 原圖約 1536 × 1024。
  左側約 150px 為文字區。
  角色區約 1386px。
  9 個動畫 frame。

  顯示時縮小至約 50%。
*/

#mageSprite{
  position:absolute;
  left:0;
  top:0;

  width:84px;
  height:78px;

  overflow:hidden;

  background-image:url("29E84ABB-2A8C-49FA-99D5-43D4867A6615.png");
  background-repeat:no-repeat;

  background-size:768px 512px;

  filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));
}

.hp{
  position:absolute;
  height:6px;
  background:#321;
  border:1px solid #111;
  border-radius:4px;
  overflow:hidden;
}

.hp span{
  display:block;
  height:100%;
  background:#e55353;
}

#mage .hp{
  left:7px;
  right:7px;
  bottom:2px;
}

.slime{
  position:absolute;
  width:44px;
  height:48px;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:10;
}

.slimeIcon{
  font-size:31px;
  line-height:34px;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
}

.slime .hp{
  left:2px;
  right:2px;
  bottom:0;
}

.targetRing{
  position:absolute;
  width:50px;
  height:24px;
  border:2px solid rgba(255,230,90,.8);
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:5;
}

.spell{
  position:absolute;
  transform:translate(-50%,-50%);
  font-size:26px;
  z-index:40;
  animation:spell .45s forwards;
}

@keyframes spell{
  0%{opacity:0;transform:translate(-50%,-40%) scale(.5)}
  40%{opacity:1;transform:translate(-50%,-70%) scale(1.3)}
  100%{opacity:0;transform:translate(-50%,-120%) scale(.8)}
}

.damage{
  position:absolute;
  transform:translate(-50%,-50%);
  font-weight:bold;
  font-size:13px;
  z-index:50;
  text-shadow:0 1px 3px #000;
  animation:dmg .7s forwards;
}

@keyframes dmg{
  to{
    opacity:0;
    transform:translate(-50%,-110%);
  }
}

#panel{
  margin-top:10px;
  background:#181e29;
  padding:10px;
  border-radius:10px;
}

#log{
  height:105px;
  overflow:auto;
  color:#bdc6d6;
  font-size:12px;
  line-height:1.5;
}

.debug{
  color:#8ee29a;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="app">

<h2>⚔️ Mage Idle — P0.2C-R1</h2>

<div id="topbar">

<div id="stats">
Lv.<span id="level">1</span>
｜ EXP <span id="exp">0</span>/<span id="expNeed">100</span>
｜ 擊殺 <span id="kills">0</span>
<br>
HP <span id="hpText">100</span>/100
｜ <span id="stateText">尋找目標</span>
</div>

<button id="pauseBtn">暫停</button>

</div>

<div id="game">

<div id="mage">
<div id="mageSprite"></div>
<div class="hp">
<span id="mageHp"></span>
</div>
</div>

</div>

<div id="panel">

<div>
下一技能：
<strong id="nextSkill">🔥 Fire</strong>
</div>

<div id="log">
<div class="debug">P0.2C-R1</div>
<div>🔒 P0.2B-4 CORE</div>
<div>✨ FOUR DIRECTION CAST</div>
</div>

</div>

</div>

<script>

/* =========================
   DOM
========================= */

const game=document.getElementById("game");
const mageEl=document.getElementById("mage");
const mageSprite=document.getElementById("mageSprite");

const hpText=document.getElementById("hpText");
const mageHp=document.getElementById("mageHp");

const levelEl=document.getElementById("level");
const expEl=document.getElementById("exp");
const expNeedEl=document.getElementById("expNeed");
const killsEl=document.getElementById("kills");

const stateText=document.getElementById("stateText");
const nextSkill=document.getElementById("nextSkill");

const pauseBtn=document.getElementById("pauseBtn");
const logEl=document.getElementById("log");


/* =========================
   GAME
========================= */

let paused=false;
let lastTime=performance.now();

let level=1;
let exp=0;
let expNeed=100;
let kills=0;


/* =========================
   ATLAS
========================= */

/*
新圖：

1536 × 1024 左右

縮放成：
768 × 512

左側文字欄：
約 75px（縮放後）

角色動畫：
9 frame

橫向 frame 步距：
約 76px

縱向 row 步距：
約 55px

這版集中測試新 Atlas。
*/

const ATLAS={

  baseX:-76,

  stepX:76,

  rows:{
    idle:-3,
    down:-58,
    left:-113,
    right:-168,
    up:-223,

    castDown:-278,
    castLeft:-333,
    castRight:-388,
    castUp:-443
  }

};


/* =========================
   SPRITE
========================= */

function setSprite(row,frame){

  frame=Math.max(0,Math.min(8,frame));

  const x=
    ATLAS.baseX-
    frame*ATLAS.stepX;

  mageSprite.style.backgroundPosition=
    x+"px "+row+"px";
}


/* =========================
   DIRECTION
========================= */

function directionToTarget(target){

  const dx=target.x-mage.x;
  const dy=target.y-mage.y;

  const angle=
    Math.atan2(dy,dx)*
    180/Math.PI;

  if(angle>=-45 && angle<45)
    return "right";

  if(angle>=45 && angle<135)
    return "down";

  if(angle>=-135 && angle<-45)
    return "up";

  return "left";
}


/* =========================
   MAGE
========================= */

const mage={

  x:0,
  y:0,

  hp:100,
  maxHp:100,

  speed:70,

  target:null,

  direction:"down",

  lockedDirection:"down",

  facingLocked:false,

  frame:0,
  frameTimer:0,

  casting:false,
  castStart:0,
  castDuration:720,

  castSkill:null,
  castTarget:null,
  castHit:false,

  skillIndex:0,
  lastAttack:0
};


/* =========================
   SKILLS
========================= */

const skills=[

  {
    name:"🔥 Fire",
    icon:"🔥",
    range:145,
    damage:10,
    cooldown:1000
  },

  {
    name:"⚡ Lightning",
    icon:"⚡",
    range:145,
    damage:10,
    cooldown:1000
  },

  {
    name:"❄️ Ice",
    icon:"❄️",
    range:48,
    damage:7,
    cooldown:650
  }

];


/* =========================
   SLIMES
========================= */

const slimes=[];

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}


function createSlime(id){

  const el=document.createElement("div");

  el.className="slime";

  el.innerHTML=
  `<div class="slimeIcon">🟢</div>
   <div class="hp"><span></span></div>`;

  game.appendChild(el);

  const slime={

    id,

    x:0,
    y:0,

    hp:50,
    maxHp:50,

    attack:5,

    alive:true,

    respawnAt:0,

    lastAttack:0,

    el,

    hpEl:el.querySelector(".hp span")
  };

  slimes.push(slime);

  respawnSlime(slime);
}


function respawnSlime(slime){

  slime.x=
    35+
    Math.random()*
    (game.clientWidth-70);

  slime.y=
    40+
    Math.random()*
    (game.clientHeight-90);

  slime.hp=50;
  slime.alive=true;

  slime.el.style.display="block";

  updateSlime(slime);
}


function updateSlime(slime){

  slime.el.style.left=
    slime.x+"px";

  slime.el.style.top=
    slime.y+"px";

  slime.hpEl.style.width=
    (slime.hp/slime.maxHp*100)+"%";
}


/* =========================
   TARGET RING
========================= */

const targetRing=
document.createElement("div");

targetRing.className="targetRing";

game.appendChild(targetRing);


/* =========================
   TARGET
========================= */

function findTarget(){

  let best=null;
  let bestDistance=Infinity;

  for(const slime of slimes){

    if(!slime.alive)
      continue;

    const d=distance(mage,slime);

    if(d<bestDistance){

      best=slime;
      bestDistance=d;
    }
  }

  mage.target=best;

  mage.facingLocked=false;
}


/* =========================
   FACING LOCK
========================= */

function lockFacing(){

  if(!mage.target)
    return;

  mage.direction=
    directionToTarget(
      mage.target
    );

  mage.lockedDirection=
    mage.direction;

  mage.facingLocked=true;
}


/* =========================
   WALK ANIMATION
========================= */

function walkAnimation(dt){

  mage.frameTimer+=dt;

  if(mage.frameTimer>=125){

    mage.frameTimer=0;

    mage.frame=
      (mage.frame+1)%9;
  }

  let row=
    ATLAS.rows.down;

  if(mage.direction==="left")
    row=ATLAS.rows.left;

  if(mage.direction==="right")
    row=ATLAS.rows.right;

  if(mage.direction==="up")
    row=ATLAS.rows.up;

  setSprite(row,mage.frame);
}


/* =========================
   IDLE
========================= */

function idleAnimation(dt){

  mage.frameTimer+=dt;

  if(mage.frameTimer>=220){

    mage.frameTimer=0;

    mage.frame=
      (mage.frame+1)%9;
  }

  setSprite(
    ATLAS.rows.idle,
    mage.frame
  );
}


/* =========================
   CAST ROW
========================= */

function castRow(){

  switch(
    mage.lockedDirection
  ){

    case "left":
      return ATLAS.rows.castLeft;

    case "right":
      return ATLAS.rows.castRight;

    case "up":
      return ATLAS.rows.castUp;

    default:
      return ATLAS.rows.castDown;
  }
}


/* =========================
   START CAST
========================= */

function startCast(skill,now){

  if(mage.casting)
    return;

  /*
  P0.2B-4：

  先鎖方向。

  然後才施法。
  */

  lockFacing();

  mage.casting=true;

  mage.castStart=now;

  mage.castSkill=skill;

  mage.castTarget=mage.target;

  mage.castHit=false;

  mage.frame=0;
}


/* =========================
   CAST ANIMATION
========================= */

function castAnimation(now){

  const elapsed=
    now-mage.castStart;

  /*
  9 frame
  */

  const frame=
    Math.min(
      8,
      Math.floor(
        elapsed/
        (mage.castDuration/9)
      )
    );

  /*
  真正使用四方向 Cast row。
  */

  setSprite(
    castRow(),
    frame
  );


  /*
  中段命中。
  */

  if(
    elapsed>=360 &&
    !mage.castHit
  ){

    mage.castHit=true;

    applySpell();
  }


  if(
    elapsed>=
    mage.castDuration
  ){

    mage.casting=false;

    mage.castSkill=null;
    mage.castTarget=null;

    mage.frame=0;
    mage.frameTimer=0;

    /*
    不解除 Facing Lock。

    同一目標繼續保持方向。
    */
  }
}


/* =========================
   SPELL HIT
========================= */

function applySpell(){

  const target=
    mage.castTarget;

  const skill=
    mage.castSkill;

  if(
    !target ||
    !target.alive ||
    !skill
  )
    return;


  target.hp-=skill.damage;

  showSpell(
    target,
    skill
  );

  showDamage(
    target,
    skill.damage
  );

  addLog(
    skill.name+
    " → Slime -"+
    skill.damage
  );


  if(target.hp<=0){

    target.hp=0;

    updateSlime(target);

    killSlime(target);

  }else{

    updateSlime(target);
  }
}


/* =========================
   SPELL EFFECT
========================= */

function showSpell(target,skill){

  const el=
    document.createElement("div");

  el.className="spell";

  el.textContent=skill.icon;

  el.style.left=
    target.x+"px";

  el.style.top=
    (target.y-15)+"px";

  game.appendChild(el);

  setTimeout(
    ()=>el.remove(),
    450
  );
}


function showDamage(target,value){

  const el=
    document.createElement("div");

  el.className="damage";

  el.textContent=
    "-"+value;

  el.style.left=
    target.x+"px";

  el.style.top=
    (target.y-25)+"px";

  game.appendChild(el);

  setTimeout(
    ()=>el.remove(),
    700
  );
}


/* =========================
   KILL
========================= */

function killSlime(slime){

  slime.alive=false;

  slime.el.style.display=
    "none";

  slime.respawnAt=
    performance.now()+5000;

  kills++;
  exp+=10;

  addLog(
    "🟢 Slime 擊倒！ +10 EXP"
  );


  if(exp>=expNeed){

    exp-=expNeed;

    level++;

    expNeed=
      Math.floor(
        expNeed*1.25
      );

    addLog(
      "✨ 升級 Lv."+
      level
    );
  }


  mage.target=null;

  mage.facingLocked=false;
}


/* =========================
   ATTACK
========================= */

function attack(now){

  if(
    !mage.target ||
    mage.casting
  )
    return;


  const skill=
    skills[
      mage.skillIndex
    ];


  if(
    now-mage.lastAttack<
    skill.cooldown
  )
    return;


  mage.lastAttack=now;


  startCast(
    skill,
    now
  );


  mage.skillIndex=
    (mage.skillIndex+1)%
    skills.length;


  nextSkill.textContent=
    skills[
      mage.skillIndex
    ].name;
}


/* =========================
   AI
========================= */

function updateMage(dt,now){

  if(
    !mage.target ||
    !mage.target.alive
  ){

    findTarget();
  }


  if(!mage.target){

    stateText.textContent=
      "等待怪物";

    idleAnimation(dt);

    return;
  }


  /*
  CAST：

  完全停止移動。
  完全停止轉向。
  */

  if(mage.casting){

    stateText.textContent=
      "施法中";

    castAnimation(now);

    return;
  }


  const target=
    mage.target;

  const dx=
    target.x-mage.x;

  const dy=
    target.y-mage.y;

  const d=
    Math.hypot(dx,dy);


  const skill=
    skills[
      mage.skillIndex
    ];


  /*
  MOVE
  */

  if(d>skill.range){

    mage.facingLocked=false;

    mage.direction=
      directionToTarget(target);

    stateText.textContent=
      "追蹤目標";


    const step=
      mage.speed*
      dt/1000;


    mage.x+=
      dx/d*
      Math.min(step,d);

    mage.y+=
      dy/d*
      Math.min(step,d);


    walkAnimation(dt);
  }


  /*
  COMBAT
  */

  else{

    if(!mage.facingLocked)
      lockFacing();


    stateText.textContent=
      "鎖定攻擊";


    /*
    攻擊等待期間也維持
    鎖定方向。

    不再播放錯方向 Idle。
    */

    let row=
      ATLAS.rows.down;


    if(
      mage.lockedDirection===
      "left"
    )
      row=ATLAS.rows.left;


    if(
      mage.lockedDirection===
      "right"
    )
      row=ATLAS.rows.right;


    if(
      mage.lockedDirection===
      "up"
    )
      row=ATLAS.rows.up;


    setSprite(row,0);


    attack(now);
  }


  mage.x=
    Math.max(
      42,
      Math.min(
        game.clientWidth-42,
        mage.x
      )
    );


  mage.y=
    Math.max(
      45,
      Math.min(
        game.clientHeight-45,
        mage.y
      )
    );
}


/* =========================
   ENEMY ATTACK
========================= */

function enemyAttack(now){

  for(const slime of slimes){

    if(!slime.alive)
      continue;


    if(
      distance(mage,slime)>52
    )
      continue;


    if(
      now-slime.lastAttack<
      1000
    )
      continue;


    slime.lastAttack=now;

    mage.hp-=slime.attack;


    if(mage.hp<=0){

      addLog(
        "💀 Mage 倒下"
      );

      mage.hp=100;

      mage.x=
        game.clientWidth/2;

      mage.y=
        game.clientHeight-70;

      mage.target=null;

      mage.casting=false;

      mage.facingLocked=false;

      mage.direction="down";

      break;
    }
  }
}


/* =========================
   RESPAWN
========================= */

function respawns(now){

  for(const slime of slimes){

    if(
      !slime.alive &&
      now>=slime.respawnAt
    ){

      respawnSlime(slime);

      addLog(
        "🟢 Slime 重生"
      );
    }
  }
}


/* =========================
   VISUAL
========================= */

function updateVisual(){

  mageEl.style.left=
    mage.x+"px";

  mageEl.style.top=
    mage.y+"px";


  if(
    mage.target &&
    mage.target.alive
  ){

    targetRing.style.display=
      "block";

    targetRing.style.left=
      mage.target.x+"px";

    targetRing.style.top=
      (mage.target.y+14)+"px";

  }else{

    targetRing.style.display=
      "none";
  }
}


/* =========================
   HUD
========================= */

function updateHUD(){

  hpText.textContent=
    mage.hp;

  mageHp.style.width=
    mage.hp+"%";

  levelEl.textContent=
    level;

  expEl.textContent=
    exp;

  expNeedEl.textContent=
    expNeed;

  killsEl.textContent=
    kills;
}


/* =========================
   LOG
========================= */

function addLog(text){

  const div=
    document.createElement("div");

  div.textContent=text;

  logEl.appendChild(div);

  while(
    logEl.children.length>30
  ){

    logEl.removeChild(
      logEl.children[1]
    );
  }

  logEl.scrollTop=
    logEl.scrollHeight;
}


/* =========================
   LOOP
========================= */

function loop(now){

  const dt=
    Math.min(
      50,
      now-lastTime
    );

  lastTime=now;


  if(!paused){

    respawns(now);

    updateMage(
      dt,
      now
    );

    enemyAttack(now);

    updateVisual();

    updateHUD();
  }


  requestAnimationFrame(loop);
}


/* =========================
   PAUSE
========================= */

pauseBtn.onclick=()=>{

  paused=!paused;

  pauseBtn.textContent=
    paused
    ?"繼續"
    :"暫停";
};


/* =========================
   START
========================= */

function start(){

  mage.x=
    game.clientWidth/2;

  mage.y=
    game.clientHeight-70;


  for(let i=0;i<8;i++){

    createSlime(i);
  }


  setSprite(
    ATLAS.rows.idle,
    0
  );


  updateVisual();

  updateHUD();


  addLog(
    "✅ P0.2C-R1 啟動"
  );

  addLog(
    "🔒 P0.2B-4 CORE"
  );

  addLog(
    "✨ 4-Direction Cast"
  );


  requestAnimationFrame(loop);
}


start();

</script>

</body>
</html>
