<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mage Idle - P0.2C-R2.3</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#10141c;
  color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app{
  max-width:760px;
  margin:auto;
  padding:12px;
}

h2{
  margin:4px 0 10px;
  font-size:20px;
}

#topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

#stats{
  font-size:13px;
  line-height:1.55;
}

button{
  border:0;
  border-radius:9px;
  padding:9px 14px;
  background:#34445f;
  color:white;
  font-weight:bold;
}

#game{
  position:relative;
  width:100%;
  height:520px;
  overflow:hidden;

  border:2px solid #4c6646;
  border-radius:12px;

  background:
    radial-gradient(
      circle at 20% 30%,
      rgba(255,255,255,.06) 0 2px,
      transparent 3px
    ),
    radial-gradient(
      circle at 70% 70%,
      rgba(0,0,0,.08) 0 3px,
      transparent 4px
    ),
    linear-gradient(
      #638f52,
      #527c45
    );
}

/* ========================================
   MAGE
======================================== */

#mage{
  position:absolute;

  width:100px;
  height:110px;

  transform:
    translate(-50%,-82%);

  z-index:20;

  pointer-events:none;
}

/*
  R2.3

  Sprite 真實尺寸由 JavaScript 讀取。

  CSS 不再假設圖片是 1620×1620。
*/

#mageSprite{
  position:absolute;

  width:92px;
  height:92px;

  left:4px;
  bottom:10px;

  overflow:hidden;

  background-image:
    url("6948C073-9E7F-4ED8-9991-CDB6BFC17D60.png");

  background-repeat:no-repeat;

  background-position:0 0;

  filter:
    drop-shadow(
      0 3px 2px
      rgba(0,0,0,.35)
    );

  pointer-events:none;
}

.hp{
  position:absolute;

  height:6px;

  background:#321;

  border:1px solid #111;

  border-radius:4px;

  overflow:hidden;
}

.hp span{
  display:block;

  height:100%;

  background:#e55353;
}

#mage .hp{
  left:12px;
  right:12px;
  bottom:0;
}

/* ========================================
   SLIME
======================================== */

.slime{
  position:absolute;

  width:44px;
  height:48px;

  transform:
    translate(-50%,-50%);

  text-align:center;

  z-index:10;
}

.slimeIcon{
  font-size:31px;
  line-height:34px;

  filter:
    drop-shadow(
      0 2px 2px
      rgba(0,0,0,.35)
    );
}

.slime .hp{
  left:2px;
  right:2px;
  bottom:0;
}

/* ========================================
   TARGET
======================================== */

.targetRing{
  position:absolute;

  width:50px;
  height:24px;

  border:
    2px solid rgba(255,230,90,.85);

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  z-index:5;
}

/* ========================================
   SPELL
======================================== */

.spell{
  position:absolute;

  transform:
    translate(-50%,-50%);

  font-size:26px;

  z-index:40;

  pointer-events:none;

  animation:
    spellPop .45s forwards;
}

@keyframes spellPop{

  0%{
    opacity:0;

    transform:
      translate(-50%,-40%)
      scale(.5);
  }

  40%{
    opacity:1;

    transform:
      translate(-50%,-70%)
      scale(1.3);
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-120%)
      scale(.8);
  }
}

.damage{
  position:absolute;

  transform:
    translate(-50%,-50%);

  font-size:13px;

  font-weight:bold;

  z-index:50;

  text-shadow:
    0 1px 3px #000;

  animation:
    damageFloat .7s forwards;
}

@keyframes damageFloat{

  to{
    opacity:0;

    transform:
      translate(-50%,-110%);
  }
}

/* ========================================
   PANEL
======================================== */

#panel{
  margin-top:10px;

  padding:10px;

  background:#181e29;

  border-radius:10px;
}

#nextSkillLine{
  margin-bottom:6px;
}

#log{
  height:120px;

  overflow:auto;

  color:#bdc6d6;

  font-size:12px;

  line-height:1.5;
}

.debug{
  color:#8ee29a;

  font-weight:bold;
}
</style>
</head>

<body>

<div id="app">

<h2>
⚔️ Mage Idle — P0.2C-R2.3
</h2>


<div id="topbar">

<div id="stats">

Lv.<span id="level">1</span>

｜ EXP
<span id="exp">0</span>/<span id="expNeed">100</span>

｜ 擊殺
<span id="kills">0</span>

<br>

HP
<span id="hpText">100</span>/100

｜ 狀態
<span id="stateText">初始化</span>

</div>


<button id="pauseBtn">
暫停
</button>

</div>


<div id="game">

<div id="mage">

<div id="mageSprite"></div>

<div class="hp">
<span id="mageHp"></span>
</div>

</div>

</div>


<div id="panel">

<div id="nextSkillLine">

下一技能：

<strong id="nextSkill">
🔥 Fire
</strong>

</div>


<div id="log">

<div class="debug">
P0.2C-R2.3
</div>

<div>
🔒 P0.2B-4 CORE
</div>

<div>
🎞️ REAL IMAGE SIZE / 9×9
</div>

</div>

</div>

</div>


<script>

/* ========================================
   DOM
======================================== */

const game =
document.getElementById("game");

const mageEl =
document.getElementById("mage");

const mageSprite =
document.getElementById("mageSprite");

const hpText =
document.getElementById("hpText");

const mageHp =
document.getElementById("mageHp");

const levelEl =
document.getElementById("level");

const expEl =
document.getElementById("exp");

const expNeedEl =
document.getElementById("expNeed");

const killsEl =
document.getElementById("kills");

const stateText =
document.getElementById("stateText");

const nextSkill =
document.getElementById("nextSkill");

const pauseBtn =
document.getElementById("pauseBtn");

const logEl =
document.getElementById("log");


/* ========================================
   GAME STATE
======================================== */

let paused=false;

let lastTime=
performance.now();

let level=1;

let exp=0;

let expNeed=100;

let kills=0;


/* ========================================
   SPRITE SYSTEM
   P0.2C-R2.3
======================================== */

/*
  Sprite Sheet：

  9 columns × 9 rows

  ROW 0 = Idle
  ROW 1 = Down
  ROW 2 = Left
  ROW 3 = Right
  ROW 4 = Up
  ROW 5 = Cast Down
  ROW 6 = Cast Left
  ROW 7 = Cast Right
  ROW 8 = Cast Up
*/

const SPRITE_COLS=9;

const SPRITE_ROWS=9;


/*
  遊戲內每格顯示尺寸。

  這次稍微縮成 92px，
  比 R2.2 的 100px 小一點。
*/

const DISPLAY_CELL=92;


let spriteReady=false;

let spriteNaturalWidth=0;

let spriteNaturalHeight=0;

let sourceCellWidth=0;

let sourceCellHeight=0;


const ROW={

  idle:0,

  down:1,

  left:2,

  right:3,

  up:4,

  castDown:5,

  castLeft:6,

  castRight:7,

  castUp:8

};


/*
  獨立預載圖片。

  瀏覽器會告訴我們
  GitHub PNG 真正尺寸。
*/

const spriteImage=
new Image();


spriteImage.src=
"6948C073-9E7F-4ED8-9991-CDB6BFC17D60.png";


spriteImage.onload=()=>{

  spriteNaturalWidth=
    spriteImage.naturalWidth;

  spriteNaturalHeight=
    spriteImage.naturalHeight;


  sourceCellWidth=

    spriteNaturalWidth/
    SPRITE_COLS;


  sourceCellHeight=

    spriteNaturalHeight/
    SPRITE_ROWS;


  /*
    關鍵：

    不管原始圖片到底幾 px，
    瀏覽器都把它縮放成：

    9 × 92
    ×
    9 × 92

    所以 background-position
    永遠可以用 92 為單位。
  */

  mageSprite.style.backgroundSize=

    (
      DISPLAY_CELL*
      SPRITE_COLS
    )+"px "+

    (
      DISPLAY_CELL*
      SPRITE_ROWS
    )+"px";


  mageSprite.style.width=
    DISPLAY_CELL+"px";


  mageSprite.style.height=
    DISPLAY_CELL+"px";


  spriteReady=true;


  setSprite(
    ROW.idle,
    0
  );


  addLog(

    "🖼️ PNG 真實尺寸："+

    spriteNaturalWidth+

    " × "+

    spriteNaturalHeight

  );


  addLog(

    "📐 原始單格："+

    sourceCellWidth.toFixed(2)+

    " × "+

    sourceCellHeight.toFixed(2)

  );


  addLog(
    "✅ R2.3 Sprite Grid Ready"
  );
};


spriteImage.onerror=()=>{

  addLog(
    "❌ Sprite 圖片載入失敗"
  );

};


/* ========================================
   SPRITE FRAME
======================================== */

function setSprite(
  row,
  frame
){

  if(
    !spriteReady
  ){

    return;
  }


  row=
    Math.max(
      0,
      Math.min(
        8,
        row
      )
    );


  frame=
    Math.max(
      0,
      Math.min(
        8,
        frame
      )
    );


  const x=

    -(
      frame*
      DISPLAY_CELL
    );


  const y=

    -(
      row*
      DISPLAY_CELL
    );


  mageSprite.style
  .backgroundPosition=

    x+"px "+
    y+"px";
}


/* ========================================
   MAGE
======================================== */

const mage={

  x:0,

  y:0,

  hp:100,

  maxHp:100,

  speed:70,

  target:null,

  direction:"down",

  lockedDirection:"down",

  facingLocked:false,

  frame:0,

  frameTimer:0,

  casting:false,

  castStart:0,

  castDuration:720,

  castSkill:null,

  castTarget:null,

  castHit:false,

  skillIndex:0,

  lastAttack:0

};


/* ========================================
   SKILLS
======================================== */

const skills=[

{

  name:"🔥 Fire",

  icon:"🔥",

  range:145,

  damage:10,

  cooldown:1000

},

{

  name:"⚡ Lightning",

  icon:"⚡",

  range:145,

  damage:10,

  cooldown:1000

},

{

  name:"❄️ Ice",

  icon:"❄️",

  range:48,

  damage:7,

  cooldown:650

}

];


/* ========================================
   HELPERS
======================================== */

function distance(
  a,
  b
){

  return Math.hypot(

    a.x-b.x,

    a.y-b.y

  );

}


function directionToTarget(
  target
){

  const dx=

    target.x-
    mage.x;


  const dy=

    target.y-
    mage.y;


  const angle=

    Math.atan2(
      dy,
      dx
    )*

    180/
    Math.PI;


  if(
    angle>=-45 &&
    angle<45
  ){

    return "right";

  }


  if(
    angle>=45 &&
    angle<135
  ){

    return "down";

  }


  if(
    angle>=-135 &&
    angle<-45
  ){

    return "up";

  }


  return "left";

}


/* ========================================
   ROW HELPERS
======================================== */

function movementRow(
  direction
){

  if(
    direction==="left"
  ){

    return ROW.left;

  }


  if(
    direction==="right"
  ){

    return ROW.right;

  }


  if(
    direction==="up"
  ){

    return ROW.up;

  }


  return ROW.down;

}


function castRow(
  direction
){

  if(
    direction==="left"
  ){

    return ROW.castLeft;

  }


  if(
    direction==="right"
  ){

    return ROW.castRight;

  }


  if(
    direction==="up"
  ){

    return ROW.castUp;

  }


  return ROW.castDown;

}


/* ========================================
   SLIME
======================================== */

const slimes=[];


function createSlime(
  id
){

  const el=

    document.createElement(
      "div"
    );


  el.className=
    "slime";


  el.innerHTML=

  `<div class="slimeIcon">🟢</div>
   <div class="hp"><span></span></div>`;


  game.appendChild(
    el
  );


  const slime={

    id:id,

    x:0,

    y:0,

    hp:50,

    maxHp:50,

    attack:5,

    alive:true,

    respawnAt:0,

    lastAttack:0,

    el:el,

    hpEl:
      el.querySelector(
        ".hp span"
      )

  };


  slimes.push(
    slime
  );


  respawnSlime(
    slime
  );

}


function respawnSlime(
  slime
){

  slime.x=

    35+

    Math.random()*

    Math.max(

      10,

      game.clientWidth-
      70

    );


  slime.y=

    40+

    Math.random()*

    Math.max(

      10,

      game.clientHeight-
      90

    );


  slime.hp=
    slime.maxHp;


  slime.alive=
    true;


  slime.el.style.display=
    "block";


  updateSlime(
    slime
  );

}


function updateSlime(
  slime
){

  slime.el.style.left=
    slime.x+"px";


  slime.el.style.top=
    slime.y+"px";


  slime.hpEl.style.width=

    (

      slime.hp/
      slime.maxHp*
      100

    )+"%";

}


/* ========================================
   TARGET RING
======================================== */

const targetRing=

document.createElement(
  "div"
);


targetRing.className=
"targetRing";


targetRing.style.display=
"none";


game.appendChild(
  targetRing
);


/* ========================================
   FIND TARGET
======================================== */

function findTarget(){

  let best=null;

  let bestDistance=
    Infinity;


  for(
    const slime
    of slimes
  ){

    if(
      !slime.alive
    ){

      continue;

    }


    const d=

      distance(
        mage,
        slime
      );


    if(
      d<
      bestDistance
    ){

      best=
        slime;


      bestDistance=
        d;

    }

  }


  mage.target=
    best;


  mage.facingLocked=
    false;

}


/* ========================================
   FACING LOCK
======================================== */

function lockFacing(){

  if(
    !mage.target
  ){

    return;

  }


  mage.direction=

    directionToTarget(
      mage.target
    );


  mage.lockedDirection=
    mage.direction;


  mage.facingLocked=
    true;

}


/* ========================================
   WALK ANIMATION
======================================== */

function walkAnimation(
  dt
){

  mage.frameTimer+=
    dt;


  if(
    mage.frameTimer>=125
  ){

    mage.frameTimer=0;


    mage.frame=

      (
        mage.frame+
        1
      )%9;

  }


  setSprite(

    movementRow(
      mage.direction
    ),

    mage.frame

  );

}


/* ========================================
   IDLE
======================================== */

function idleAnimation(
  dt
){

  mage.frameTimer+=
    dt;


  if(
    mage.frameTimer>=220
  ){

    mage.frameTimer=0;


    mage.frame=

      (
        mage.frame+
        1
      )%9;

  }


  setSprite(

    ROW.idle,

    mage.frame

  );

}


/* ========================================
   CAST START
======================================== */

function startCast(
  skill,
  now
){

  if(
    mage.casting ||
    !mage.target
  ){

    return;

  }


  /*
    施法瞬間重新取得怪物方向。

    接著鎖住。

    Cast 過程中不再轉向。
  */

  lockFacing();


  mage.casting=
    true;


  mage.castStart=
    now;


  mage.castSkill=
    skill;


  mage.castTarget=
    mage.target;


  mage.castHit=
    false;


  mage.frame=
    0;


  mage.frameTimer=
    0;

}


/* ========================================
   CAST ANIMATION
======================================== */

function castAnimation(
  now
){

  const elapsed=

    now-
    mage.castStart;


  const frameDuration=

    mage.castDuration/
    9;


  const frame=

    Math.min(

      8,

      Math.floor(

        elapsed/
        frameDuration

      )

    );


  setSprite(

    castRow(
      mage.lockedDirection
    ),

    frame

  );


  /*
    Cast 動畫中段命中。
  */

  if(
    elapsed>=360 &&
    !mage.castHit
  ){

    mage.castHit=
      true;


    applySpell();

  }


  /*
    Cast 完成。
  */

  if(
    elapsed>=
    mage.castDuration
  ){

    mage.casting=
      false;


    mage.castSkill=
      null;


    mage.castTarget=
      null;


    mage.frame=
      0;


    mage.frameTimer=
      0;

  }

}


/* ========================================
   APPLY SPELL
======================================== */

function applySpell(){

  const target=
    mage.castTarget;


  const skill=
    mage.castSkill;


  if(
    !target ||
    !target.alive ||
    !skill
  ){

    return;

  }


  target.hp-=

    skill.damage;


  showSpell(
    target,
    skill
  );


  showDamage(
    target,
    skill.damage
  );


  addLog(

    skill.name+

    " → Slime -"+

    skill.damage

  );


  if(
    target.hp<=0
  ){

    target.hp=
      0;


    updateSlime(
      target
    );


    killSlime(
      target
    );

  }

  else{

    updateSlime(
      target
    );

  }

}


/* ========================================
   SPELL EFFECT
======================================== */

function showSpell(
  target,
  skill
){

  const el=

    document.createElement(
      "div"
    );


  el.className=
    "spell";


  el.textContent=
    skill.icon;


  el.style.left=
    target.x+"px";


  el.style.top=

    (
      target.y-
      15
    )+"px";


  game.appendChild(
    el
  );


  setTimeout(

    ()=>el.remove(),

    450

  );

}


/* ========================================
   DAMAGE
======================================== */

function showDamage(
  target,
  value
){

  const el=

    document.createElement(
      "div"
    );


  el.className=
    "damage";


  el.textContent=
    "-"+value;


  el.style.left=
    target.x+"px";


  el.style.top=

    (
      target.y-
      25
    )+"px";


  game.appendChild(
    el
  );


  setTimeout(

    ()=>el.remove(),

    700

  );

}


/* ========================================
   KILL
======================================== */

function killSlime(
  slime
){

  slime.alive=
    false;


  slime.el.style.display=
    "none";


  slime.respawnAt=

    performance.now()+
    5000;


  kills++;


  exp+=10;


  addLog(
    "🟢 Slime 擊倒！ +10 EXP"
  );


  if(
    exp>=
    expNeed
  ){

    exp-=
      expNeed;


    level++;


    expNeed=

      Math.floor(

        expNeed*
        1.25

      );


    addLog(

      "✨ 升級 Lv."+
      level

    );

  }


  mage.target=
    null;


  mage.facingLocked=
    false;

}


/* ========================================
   ATTACK
======================================== */

function attack(
  now
){

  if(
    !mage.target ||
    mage.casting
  ){

    return;

  }


  const skill=

    skills[
      mage.skillIndex
    ];


  if(
    now-
    mage.lastAttack<
    skill.cooldown
  ){

    return;

  }


  mage.lastAttack=
    now;


  startCast(
    skill,
    now
  );


  mage.skillIndex=

    (
      mage.skillIndex+
      1
    )%

    skills.length;


  nextSkill.textContent=

    skills[
      mage.skillIndex
    ].name;

}


/* ========================================
   MAGE AI
======================================== */

function updateMage(
  dt,
  now
){

  if(
    !mage.target ||
    !mage.target.alive
  ){

    findTarget();

  }


  /*
    沒怪。
  */

  if(
    !mage.target
  ){

    stateText.textContent=
      "等待怪物";


    idleAnimation(
      dt
    );


    return;

  }


  /*
    正在 Cast。

    不移動。
    不轉向。
    不重新選方向。
  */

  if(
    mage.casting
  ){

    stateText.textContent=
      "施法中";


    castAnimation(
      now
    );


    return;

  }


  const target=
    mage.target;


  const dx=

    target.x-
    mage.x;


  const dy=

    target.y-
    mage.y;


  const d=

    Math.hypot(
      dx,
      dy
    );


  const skill=

    skills[
      mage.skillIndex
    ];


  /*
    距離不足：
    追怪。
  */

  if(
    d>
    skill.range
  ){

    mage.facingLocked=
      false;


    mage.direction=

      directionToTarget(
        target
      );


    stateText.textContent=
      "追蹤目標";


    const step=

      mage.speed*
      dt/
      1000;


    if(
      d>0
    ){

      mage.x+=

        dx/d*

        Math.min(
          step,
          d
        );


      mage.y+=

        dy/d*

        Math.min(
          step,
          d
        );

    }


    walkAnimation(
      dt
    );

  }


  /*
    已進入技能距離。
  */

  else{

    if(
      !mage.facingLocked
    ){

      lockFacing();

    }


    stateText.textContent=
      "鎖定攻擊";


    /*
      CD 等待期間，
      維持面向怪物。

      不播放走路動畫。
  */

    setSprite(

      movementRow(
        mage.lockedDirection
      ),

      0

    );


    attack(
      now
    );

  }


  /*
    地圖邊界。
  */

  mage.x=

    Math.max(

      50,

      Math.min(

        game.clientWidth-
        50,

        mage.x

      )

    );


  mage.y=

    Math.max(

      65,

      Math.min(

        game.clientHeight-
        45,

        mage.y

      )

    );

}


/* ========================================
   ENEMY ATTACK
======================================== */

function enemyAttack(
  now
){

  for(
    const slime
    of slimes
  ){

    if(
      !slime.alive
    ){

      continue;

    }


    if(
      distance(
        mage,
        slime
      )>
      52
    ){

      continue;

    }


    if(
      now-
      slime.lastAttack<
      1000
    ){

      continue;

    }


    slime.lastAttack=
      now;


    mage.hp-=

      slime.attack;


    if(
      mage.hp<=0
    ){

      addLog(
        "💀 Mage 倒下，返回起點"
      );


      mage.hp=
        mage.maxHp;


      mage.x=

        game.clientWidth/
        2;


      mage.y=

        game.clientHeight-
        70;


      mage.target=
        null;


      mage.casting=
        false;


      mage.castSkill=
        null;


      mage.castTarget=
        null;


      mage.facingLocked=
        false;


      mage.direction=
        "down";


      mage.lockedDirection=
        "down";


      mage.frame=
        0;


      break;

    }

  }

}


/* ========================================
   RESPAWN
======================================== */

function updateRespawns(
  now
){

  for(
    const slime
    of slimes
  ){

    if(
      !slime.alive &&
      now>=
      slime.respawnAt
    ){

      respawnSlime(
        slime
      );


      addLog(
        "🟢 Slime 重生"
      );

    }

  }

}


/* ========================================
   VISUAL
======================================== */

function updateVisual(){

  mageEl.style.left=
    mage.x+"px";


  mageEl.style.top=
    mage.y+"px";


  if(
    mage.target &&
    mage.target.alive
  ){

    targetRing.style.display=
      "block";


    targetRing.style.left=
      mage.target.x+"px";


    targetRing.style.top=

      (
        mage.target.y+
        14
      )+"px";

  }

  else{

    targetRing.style.display=
      "none";

  }

}


/* ========================================
   HUD
======================================== */

function updateHUD(){

  hpText.textContent=
    mage.hp;


  mageHp.style.width=

    (

      mage.hp/
      mage.maxHp*
      100

    )+"%";


  levelEl.textContent=
    level;


  expEl.textContent=
    exp;


  expNeedEl.textContent=
    expNeed;


  killsEl.textContent=
    kills;

}


/* ========================================
   LOG
======================================== */

function addLog(
  text
){

  const div=

    document.createElement(
      "div"
    );


  div.textContent=
    text;


  logEl.appendChild(
    div
  );


  while(
    logEl.children.length>
    35
  ){

    logEl.removeChild(
      logEl.children[1]
    );

  }


  logEl.scrollTop=
    logEl.scrollHeight;

}


/* ========================================
   LOOP
======================================== */

function loop(
  now
){

  const dt=

    Math.min(

      50,

      now-
      lastTime

    );


  lastTime=
    now;


  if(
    !paused
  ){

    updateRespawns(
      now
    );


    updateMage(
      dt,
      now
    );


    enemyAttack(
      now
    );


    updateVisual();


    updateHUD();

  }


  requestAnimationFrame(
    loop
  );

}


/* ========================================
   PAUSE
======================================== */

pauseBtn.onclick=
()=>{

  paused=
    !paused;


  pauseBtn.textContent=

    paused
    ?
    "繼續"
    :
    "暫停";

};


/* ========================================
   START
======================================== */

function start(){

  mage.x=

    game.clientWidth/
    2;


  mage.y=

    game.clientHeight-
    70;


  for(
    let i=0;
    i<8;
    i++
  ){

    createSlime(
      i
    );

  }


  /*
    Sprite 尚未載入時
    setSprite 會安全跳過。

    圖片 onload 後
    自己會設定 Idle 0。
  */

  updateVisual();


  updateHUD();


  addLog(
    "✅ P0.2C-R2.3 啟動"
  );


  addLog(
    "🔒 P0.2B-4 CORE"
  );


  addLog(
    "🎞️ 等待 Sprite 真實尺寸..."
  );


  requestAnimationFrame(
    loop
  );

}


start();

</script>
