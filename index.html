<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Mage Idle - P0.3A</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  background:#0d1117;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  padding:12px;
}

#app{
  width:100%;
  max-width:760px;
  margin:auto;
}

h2{
  margin:4px 0 6px;
  font-size:20px;
}

#version{
  font-size:12px;
  color:#8b949e;
  margin-bottom:10px;
}

/* ================================
   STATUS
================================ */

#status{
  background:#161b22;
  border:1px solid #30363d;
  border-radius:10px;

  padding:10px 12px;
  margin-bottom:10px;

  font-size:14px;
  line-height:1.7;
}

#directionText{
  color:#58a6ff;
  font-weight:bold;
}

#frameText{
  color:#7ee787;
  font-weight:bold;
}

/* ================================
   GAME MAP
================================ */

#game{
  position:relative;

  width:100%;
  height:520px;

  overflow:hidden;

  border:2px solid #43633c;
  border-radius:12px;

  background:
    radial-gradient(
      circle at 20% 25%,
      rgba(255,255,255,.08) 0 2px,
      transparent 3px
    ),

    radial-gradient(
      circle at 75% 65%,
      rgba(0,0,0,.08) 0 3px,
      transparent 4px
    ),

    linear-gradient(
      #679557,
      #527d46
    );
}

/* ================================
   PATH MARKERS
================================ */

.marker{
  position:absolute;

  width:8px;
  height:8px;

  background:
    rgba(255,255,255,.20);

  border-radius:50%;

  transform:
    translate(-50%,-50%);
}

/* ================================
   MAGE
================================ */

#mage{
  position:absolute;

  width:110px;
  height:130px;

  transform:
    translate(-50%,-82%);

  pointer-events:none;

  z-index:20;
}

/*
  P0.3A：

  不再使用 background-position。

  角色就是一個正常 <img>。

  JavaScript 只負責改變圖片顯示區域。
*/

#mageView{
  position:absolute;

  left:0;
  bottom:8px;

  width:110px;
  height:110px;

  overflow:hidden;

  pointer-events:none;
}

#spriteSheet{
  position:absolute;

  max-width:none;

  user-select:none;

  pointer-events:none;

  image-rendering:auto;
}

/* ================================
   SHADOW
================================ */

#shadow{
  position:absolute;

  left:50%;
  bottom:5px;

  width:48px;
  height:14px;

  transform:
    translateX(-50%);

  background:
    rgba(0,0,0,.25);

  border-radius:50%;

  filter:blur(1px);

  z-index:-1;
}

/* ================================
   NAME
================================ */

#mageName{
  position:absolute;

  left:50%;
  bottom:-8px;

  transform:
    translateX(-50%);

  white-space:nowrap;

  font-size:11px;

  color:white;

  text-shadow:
    0 1px 3px #000;
}

/* ================================
   PANEL
================================ */

#panel{
  margin-top:10px;

  padding:10px 12px;

  background:#161b22;

  border:1px solid #30363d;

  border-radius:10px;

  font-size:13px;

  line-height:1.7;
}

.good{
  color:#7ee787;
}

.warn{
  color:#f2cc60;
}

#controls{
  display:flex;
  gap:8px;

  margin-top:10px;
}

button{
  flex:1;

  border:0;

  border-radius:9px;

  padding:11px;

  background:#30363d;

  color:white;

  font-weight:bold;

  font-size:14px;
}

button:active{
  transform:scale(.98);
}

</style>
</head>

<body>

<div id="app">

<h2>
🧙 Mage Idle — P0.3A
</h2>

<div id="version">
天堂模板式動畫架構測試
</div>


<div id="status">

目前動作：
<span id="directionText">
載入中
</span>

<br>

動畫 Frame：
<span id="frameText">
-
</span>

</div>


<div id="game">

  <div id="mage">

    <div id="shadow"></div>

    <div id="mageView">

      <img
        id="spriteSheet"
        src="A06B05E6-A958-48CD-9920-792F573C0CB6.png"
        alt=""
      >

    </div>

    <div id="mageName">
      Mage
    </div>

  </div>

</div>


<div id="controls">

<button id="pauseBtn">
暫停
</button>

<button id="restartBtn">
重新開始
</button>

</div>


<div id="panel">

<div class="good">
✓ P0.3 新動畫播放器
</div>

<div class="good">
✓ 不使用舊版 background-position
</div>

<div class="good">
✓ 自動測試四方向移動
</div>

<div class="warn">
測試順序：↓ → ← → → → ↑
</div>

<div>
🔒 P0.2B-4 Safety Anchor
</div>

</div>

</div>


<script>

/* =========================================
   P0.3A

   Mage Animation Prototype

   這一版只測：

   DOWN
   LEFT
   RIGHT
   UP

   沒有戰鬥系統。
========================================= */


/* =========================================
   DOM
========================================= */

const game =
document.getElementById("game");

const mage =
document.getElementById("mage");

const mageView =
document.getElementById("mageView");

const sprite =
document.getElementById("spriteSheet");

const directionText =
document.getElementById("directionText");

const frameText =
document.getElementById("frameText");

const pauseBtn =
document.getElementById("pauseBtn");

const restartBtn =
document.getElementById("restartBtn");


/* =========================================
   IMPORTANT

   新圖片本身包含：

   左側標題欄
   上方 Frame 編號
   五排動畫

   所以不能再假設：

   圖片寬度 / 9
   圖片高度 / 5

   我們明確定義實際動畫區域。
========================================= */


/*
  這張生成圖片是：

  1536 × 1024

  左側 label 約 150px。

  每排高度約 204.8px。

  每排上方約有 30px 的編號列。

  所以我們把動畫角色區域
  明確取出。
*/


const SHEET_W = 1536;
const SHEET_H = 1024;


/*
  左側標題區寬度
*/

const CONTENT_X = 150;


/*
  右側動畫區總寬
*/

const CONTENT_W =
SHEET_W - CONTENT_X;


/*
  9 格
*/

const FRAME_W =
CONTENT_W / 9;


/*
  五排
*/

const ROW_H =
SHEET_H / 5;


/*
  每排頂部黑色數字列高度
*/

const HEADER_H = 31;


/*
  真正角色畫面高度
*/

const FRAME_H =
ROW_H - HEADER_H;


/* =========================================
   DISPLAY SCALE
========================================= */

/*
  原始每格大約：

  154 × 174

  遊戲裡縮成約 100px。
*/

const DISPLAY_W = 100;

const SCALE =
DISPLAY_W / FRAME_W;

const DISPLAY_H =
FRAME_H * SCALE;


/* =========================================
   ROW

   0 Idle
   1 Down
   2 Left
   3 Right
   4 Up
========================================= */

const ROW = {

  idle:0,

  down:1,

  left:2,

  right:3,

  up:4

};


/* =========================================
   PLAYER
========================================= */

const player = {

  x:0,

  y:0,

  speed:75,

  direction:"down",

  frame:0,

  frameTimer:0,

  frameInterval:120,

  moving:true

};


/* =========================================
   TEST PATH

   自動走一個方形。

   Down
   Left
   Right
   Up
========================================= */

let phase = 0;

let phaseStart = 0;


/*
  每個方向走 2.3 秒
*/

const PHASE_TIME = 2300;


const phases = [

  {
    name:"↓ Down",
    direction:"down"
  },

  {
    name:"← Left",
    direction:"left"
  },

  {
    name:"→ Right",
    direction:"right"
  },

  {
    name:"↑ Up",
    direction:"up"
  }

];


/* =========================================
   GAME STATE
========================================= */

let paused = false;

let ready = false;

let lastTime =
performance.now();


/* =========================================
   SPRITE LOADED
========================================= */

sprite.onload = function(){

  /*
    如果 GitHub 圖片尺寸跟預期不同，
    仍然先印出真正尺寸。
  */

  console.log(
    "Sprite:",
    sprite.naturalWidth,
    sprite.naturalHeight
  );


  /*
    整張圖片縮放。
  */

  sprite.style.width =
    (SHEET_W * SCALE) + "px";


  sprite.style.height =
    (SHEET_H * SCALE) + "px";


  /*
    viewport
  */

  mageView.style.width =
    DISPLAY_W + "px";


  mageView.style.height =
    DISPLAY_H + "px";


  mageView.style.left =
    ((110 - DISPLAY_W) / 2) + "px";


  ready = true;


  resetTest();

};


sprite.onerror = function(){

  directionText.textContent =
    "❌ 圖片載入失敗";

};


/* =========================================
   SET FRAME
========================================= */

function setFrame(
  row,
  frame
){

  if(!ready){
    return;
  }


  frame =
    Math.max(
      0,
      Math.min(
        8,
        frame
      )
    );


  /*
    原始圖片座標。
  */

  const sourceX =

    CONTENT_X +

    (
      frame *
      FRAME_W
    );


  const sourceY =

    (
      row *
      ROW_H
    ) +

    HEADER_H;


  /*
    因為整張圖片已經 SCALE，
    所以座標也一起 SCALE。
  */

  sprite.style.left =

    -(sourceX * SCALE) +
    "px";


  sprite.style.top =

    -(sourceY * SCALE) +
    "px";


  frameText.textContent =

    (frame + 1) +
    " / 9";

}


/* =========================================
   DIRECTION ROW
========================================= */

function getRow(
  direction
){

  if(direction === "left"){
    return ROW.left;
  }

  if(direction === "right"){
    return ROW.right;
  }

  if(direction === "up"){
    return ROW.up;
  }

  return ROW.down;

}


/* =========================================
   ANIMATION
========================================= */

function updateAnimation(
  dt
){

  player.frameTimer += dt;


  if(
    player.frameTimer >=
    player.frameInterval
  ){

    player.frameTimer = 0;

    player.frame =

      (
        player.frame +
        1
      ) % 9;

  }


  setFrame(

    getRow(
      player.direction
    ),

    player.frame

  );

}


/* =========================================
   MOVEMENT
========================================= */

function updateMovement(
  dt
){

  const move =

    player.speed *
    dt /
    1000;


  switch(
    player.direction
  ){

    case "down":

      player.y += move;

      break;


    case "up":

      player.y -= move;

      break;


    case "left":

      player.x -= move;

      break;


    case "right":

      player.x += move;

      break;

  }


  /*
    安全邊界
  */

  player.x =
    Math.max(
      65,
      Math.min(
        game.clientWidth - 65,
        player.x
      )
    );


  player.y =
    Math.max(
      110,
      Math.min(
        game.clientHeight - 45,
        player.y
      )
    );

}


/* =========================================
   TEST PHASE
========================================= */

function updatePhase(
  now
){

  if(
    now - phaseStart <
    PHASE_TIME
  ){

    return;
  }


  phase++;

  if(
    phase >= phases.length
  ){

    phase = 0;

    /*
      每輪重新回中央，
      避免一直撞地圖邊界。
    */

    player.x =
      game.clientWidth / 2;

    player.y =
      game.clientHeight / 2;

  }


  phaseStart = now;


  player.direction =
    phases[phase].direction;


  player.frame = 0;

  player.frameTimer = 0;


  directionText.textContent =
    phases[phase].name;

}


/* =========================================
   DRAW PLAYER
========================================= */

function drawPlayer(){

  mage.style.left =
    player.x + "px";


  mage.style.top =
    player.y + "px";

}


/* =========================================
   RESET
========================================= */

function resetTest(){

  player.x =
    game.clientWidth / 2;


  player.y =
    game.clientHeight / 2;


  player.direction =
    "down";


  player.frame = 0;

  player.frameTimer = 0;


  phase = 0;


  phaseStart =
    performance.now();


  directionText.textContent =
    phases[0].name;


  setFrame(
    ROW.down,
    0
  );


  drawPlayer();

}


/* =========================================
   BUTTONS
========================================= */

pauseBtn.onclick = function(){

  paused =
    !paused;


  pauseBtn.textContent =

    paused
    ? "繼續"
    : "暫停";

};


restartBtn.onclick = function(){

  resetTest();

};


/* =========================================
   LOOP
========================================= */

function loop(
  now
){

  const dt =

    Math.min(
      50,
      now - lastTime
    );


  lastTime = now;


  if(
    ready &&
    !paused
  ){

    updatePhase(
      now
    );


    updateMovement(
      dt
    );


    updateAnimation(
      dt
    );


    drawPlayer();

  }


  requestAnimationFrame(
    loop
  );

}


requestAnimationFrame(
  loop
);

</script>

</body>
</html>
