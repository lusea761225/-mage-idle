<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mage Idle P0.3A-2</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  background:#0d1117;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  padding:12px;
}

#app{
  max-width:760px;
  margin:auto;
}

h1{
  font-size:22px;
  margin:5px 0;
}

#sub{
  color:#8b949e;
  font-size:13px;
  margin-bottom:10px;
}

#status{
  background:#161b22;
  border:1px solid #30363d;
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:10px;
  line-height:1.7;
  font-size:14px;
}

#action{
  color:#58a6ff;
  font-weight:bold;
}

#frame{
  color:#7ee787;
  font-weight:bold;
}

/* MAP */

#game{
  position:relative;
  width:100%;
  height:520px;
  overflow:hidden;

  border:2px solid #42643b;
  border-radius:14px;

  background:
    radial-gradient(circle at 20% 25%,
      rgba(255,255,255,.07) 0 3px,
      transparent 4px),

    radial-gradient(circle at 75% 70%,
      rgba(0,0,0,.08) 0 4px,
      transparent 5px),

    linear-gradient(
      #699957,
      #527c46
    );
}

/* PLAYER */

#mage{
  position:absolute;

  width:110px;
  height:120px;

  transform:translate(-50%,-85%);

  pointer-events:none;

  z-index:10;
}

#shadow{
  position:absolute;

  width:48px;
  height:13px;

  left:50%;
  bottom:7px;

  transform:translateX(-50%);

  border-radius:50%;

  background:rgba(0,0,0,.25);
}

/*
  這是唯一顯示角色的窗口。
*/

#spriteWindow{
  position:absolute;

  width:100px;
  height:100px;

  left:5px;
  bottom:12px;

  overflow:hidden;
}

/*
  Sprite Sheet 本體。

  JavaScript 會根據圖片真正尺寸
  自動縮放成：

  9格 × 5格

  每格100px。
*/

#sprite{
  position:absolute;

  max-width:none;

  pointer-events:none;

  user-select:none;
}

/* CONTROLS */

#controls{
  display:flex;
  gap:8px;
  margin-top:10px;
}

button{
  flex:1;

  padding:11px;

  border:0;
  border-radius:9px;

  background:#30363d;
  color:white;

  font-size:14px;
  font-weight:bold;
}

#info{
  margin-top:10px;

  padding:10px 12px;

  background:#161b22;

  border:1px solid #30363d;
  border-radius:10px;

  font-size:13px;
  line-height:1.7;
}

.good{
  color:#7ee787;
}

</style>
</head>

<body>

<div id="app">

<h1>🧙 Mage Idle — P0.3A-2</h1>

<div id="sub">
天堂模板式角色動畫測試
</div>

<div id="status">

目前方向：
<span id="action">載入中...</span>

<br>

動畫 Frame：
<span id="frame">-</span>

<br>

Sprite：
<span id="size">等待圖片</span>

</div>


<div id="game">

  <div id="mage">

    <div id="shadow"></div>

    <div id="spriteWindow">

      <img
        id="sprite"
        src="31C9D3E8-52BE-4F63-B558-198195F25DD7.png"
        alt=""
      >

    </div>

  </div>

</div>


<div id="controls">

<button id="pause">
暫停
</button>

<button id="restart">
重新開始
</button>

</div>


<div id="info">

<div class="good">
✓ 新版乾淨 Sprite Sheet
</div>

<div class="good">
✓ 9 Columns × 5 Rows
</div>

<div class="good">
✓ 自動讀取圖片真正尺寸
</div>

<div>
測試循環：
↓ Down → ← Left → → Right → ↑ Up
</div>

<div>
🔒 P0.2B-4 Safety Anchor
</div>

</div>

</div>


<script>

/* =======================================
   P0.3A-2
   CLEAN SPRITE ANIMATION TEST
======================================= */

const game =
document.getElementById("game");

const mage =
document.getElementById("mage");

const sprite =
document.getElementById("sprite");

const actionText =
document.getElementById("action");

const frameText =
document.getElementById("frame");

const sizeText =
document.getElementById("size");

const pauseButton =
document.getElementById("pause");

const restartButton =
document.getElementById("restart");


/* =======================================
   SPRITE CONFIG
======================================= */

const COLS = 9;

const ROWS = 5;


/*
  每一格在遊戲裡固定顯示100×100。
*/

const CELL = 100;


/*
  Row 定義：

  0 Idle
  1 Down
  2 Left
  3 Right
  4 Up
*/

const ROW = {

  idle:0,

  down:1,

  left:2,

  right:3,

  up:4

};


let spriteReady = false;


/* =======================================
   IMAGE LOAD
======================================= */

sprite.onload = function(){

  const realWidth =
    sprite.naturalWidth;

  const realHeight =
    sprite.naturalHeight;


  sizeText.textContent =
    realWidth +
    " × " +
    realHeight;


  /*
    關鍵：

    不管圖片原本是多少px，
    整張圖統一縮成：

    900 × 500

    所以每一格一定就是：

    100 × 100
  */

  sprite.style.width =
    (CELL * COLS) + "px";

  sprite.style.height =
    (CELL * ROWS) + "px";


  spriteReady = true;


  resetGame();

};


sprite.onerror = function(){

  actionText.textContent =
    "❌ 圖片載入失敗";

};


/* =======================================
   SET FRAME
======================================= */

function setFrame(
  row,
  frame
){

  if(!spriteReady){
    return;
  }


  frame =
    Math.max(
      0,
      Math.min(
        8,
        frame
      )
    );


  row =
    Math.max(
      0,
      Math.min(
        4,
        row
      )
    );


  /*
    因為每格固定100px，
    所以完全不需要猜原圖尺寸。
  */

  sprite.style.left =
    -(frame * CELL) +
    "px";


  sprite.style.top =
    -(row * CELL) +
    "px";


  frameText.textContent =
    (frame + 1) +
    " / 9";

}


/* =======================================
   PLAYER
======================================= */

const player = {

  x:0,

  y:0,

  speed:65,

  direction:"down",

  frame:0,

  frameTimer:0,

  frameSpeed:130

};


/* =======================================
   TEST SEQUENCE
======================================= */

const phases = [

  {
    label:"↓ Down",
    direction:"down",
    row:ROW.down
  },

  {
    label:"← Left",
    direction:"left",
    row:ROW.left
  },

  {
    label:"→ Right",
    direction:"right",
    row:ROW.right
  },

  {
    label:"↑ Up",
    direction:"up",
    row:ROW.up
  }

];


let phase = 0;

let phaseTimer = 0;


/*
  每個方向2秒。
*/

const PHASE_LENGTH = 2000;


/* =======================================
   STATE
======================================= */

let paused = false;

let lastTime =
performance.now();


/* =======================================
   RESET
======================================= */

function resetGame(){

  player.x =
    game.clientWidth / 2;

  player.y =
    game.clientHeight / 2;


  player.direction =
    "down";


  player.frame = 0;

  player.frameTimer = 0;


  phase = 0;

  phaseTimer = 0;


  actionText.textContent =
    phases[0].label;


  setFrame(
    phases[0].row,
    0
  );


  draw();

}


/* =======================================
   CHANGE DIRECTION
======================================= */

function nextPhase(){

  phase++;

  if(
    phase >=
    phases.length
  ){

    phase = 0;


    /*
      每完成一輪，
      回到地圖中央。
    */

    player.x =
      game.clientWidth / 2;

    player.y =
      game.clientHeight / 2;

  }


  player.direction =
    phases[phase].direction;


  player.frame = 0;

  player.frameTimer = 0;


  actionText.textContent =
    phases[phase].label;

}


/* =======================================
   MOVEMENT
======================================= */

function updateMovement(
  dt
){

  const distance =

    player.speed *
    dt /
    1000;


  if(
    player.direction ===
    "down"
  ){

    player.y +=
      distance;

  }


  else if(
    player.direction ===
    "up"
  ){

    player.y -=
      distance;

  }


  else if(
    player.direction ===
    "left"
  ){

    player.x -=
      distance;

  }


  else if(
    player.direction ===
    "right"
  ){

    player.x +=
      distance;

  }


  /*
    防止人物離開畫面。
  */

  player.x =

    Math.max(

      60,

      Math.min(

        game.clientWidth -
        60,

        player.x

      )

    );


  player.y =

    Math.max(

      100,

      Math.min(

        game.clientHeight -
        40,

        player.y

      )

    );

}


/* =======================================
   ANIMATION
======================================= */

function updateAnimation(
  dt
){

  player.frameTimer +=
    dt;


  if(
    player.frameTimer >=
    player.frameSpeed
  ){

    player.frameTimer = 0;


    player.frame =

      (
        player.frame +
        1
      ) % 9;

  }


  setFrame(

    phases[phase].row,

    player.frame

  );

}


/* =======================================
   DRAW
======================================= */

function draw(){

  mage.style.left =
    player.x +
    "px";


  mage.style.top =
    player.y +
    "px";

}


/* =======================================
   UPDATE
======================================= */

function update(
  dt
){

  phaseTimer +=
    dt;


  if(
    phaseTimer >=
    PHASE_LENGTH
  ){

    phaseTimer = 0;

    nextPhase();

  }


  updateMovement(
    dt
  );


  updateAnimation(
    dt
  );


  draw();

}


/* =======================================
   BUTTONS
======================================= */

pauseButton.onclick =
function(){

  paused =
    !paused;


  pauseButton.textContent =

    paused
    ?
    "繼續"
    :
    "暫停";

};


restartButton.onclick =
function(){

  resetGame();

};


/* =======================================
   LOOP
======================================= */

function loop(
  now
){

  const dt =

    Math.min(

      50,

      now -
      lastTime

    );


  lastTime =
    now;


  if(
    spriteReady &&
    !paused
  ){

    update(
      dt
    );

  }


  requestAnimationFrame(
    loop
  );

}


requestAnimationFrame(
  loop
);

</script>

</body>
</html>
