<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Mage Idle - P0.2C-1</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#10141c;
  color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:12px;
}

h2{
  margin:4px 0 10px;
  font-size:20px;
}

#topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

#stats{
  font-size:13px;
  line-height:1.55;
}

button{
  border:0;
  border-radius:9px;
  padding:9px 14px;
  background:#34445f;
  color:white;
  font-weight:700;
}

#game{
  position:relative;
  width:100%;
  height:520px;
  overflow:hidden;

  border:2px solid #4c6646;
  border-radius:12px;

  background:
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.06) 0 2px,transparent 3px),
  radial-gradient(circle at 70% 70%,rgba(0,0,0,.08) 0 3px,transparent 4px),
  linear-gradient(#638f52,#527c45);

  box-shadow:
  inset 0 0 35px rgba(0,0,0,.22);
}


/* =========================
   MAGE
   ========================= */

#mage{
  position:absolute;

  width:82px;
  height:96px;

  transform:
  translate(-50%,-50%);

  z-index:20;

  pointer-events:none;
}


/*
真正的 Sprite 顯示框。

我們不再移動整張 IMG。

改用 background-image，
每次只顯示一個固定格子。
*/

#mageSprite{
  position:absolute;

  width:82px;
  height:82px;

  left:0;
  top:0;

  background-image:
  url("25E2790B-37FD-4F35-98AD-0C80CC8DC769.png");

  background-repeat:no-repeat;

  /*
  原圖：
  8 欄 × 6 排

  所以整張圖顯示成：

  82 × 8
  82 × 6
  */

  background-size:
  656px 492px;

  filter:
  drop-shadow(
    0 3px 2px
    rgba(0,0,0,.35)
  );
}


/* =========================
   HP
   ========================= */

.hp{
  position:absolute;

  height:6px;

  background:#321;

  border:
  1px solid
  rgba(0,0,0,.65);

  border-radius:4px;

  overflow:hidden;
}

.hp span{
  display:block;

  height:100%;

  width:100%;

  background:#e55353;
}

#mage .hp{
  left:8px;
  right:8px;
  bottom:2px;
}


/* =========================
   SLIME
   ========================= */

.slime{
  position:absolute;

  width:44px;
  height:48px;

  transform:
  translate(-50%,-50%);

  text-align:center;

  z-index:10;
}

.slimeIcon{
  font-size:31px;

  line-height:34px;

  filter:
  drop-shadow(
    0 2px 2px
    rgba(0,0,0,.35)
  );
}

.slime .hp{
  left:2px;
  right:2px;
  bottom:0;
}


/* =========================
   TARGET
   ========================= */

.targetRing{
  position:absolute;

  width:50px;
  height:24px;

  border:
  2px solid
  rgba(255,230,90,.8);

  border-radius:50%;

  transform:
  translate(-50%,-50%);

  z-index:5;
}


/* =========================
   SPELL
   ========================= */

.spell{
  position:absolute;

  transform:
  translate(-50%,-50%);

  z-index:30;

  font-size:26px;

  pointer-events:none;

  animation:
  spellPop .42s
  ease-out forwards;
}

@keyframes spellPop{

  0%{
    transform:
    translate(-50%,-50%)
    scale(.5);

    opacity:0;
  }

  35%{
    transform:
    translate(-50%,-70%)
    scale(1.3);

    opacity:1;
  }

  100%{
    transform:
    translate(-50%,-110%)
    scale(.8);

    opacity:0;
  }

}


.damage{
  position:absolute;

  transform:
  translate(-50%,-50%);

  z-index:40;

  font-size:13px;

  font-weight:800;

  color:white;

  text-shadow:
  0 1px 3px #000;

  pointer-events:none;

  animation:
  damageFloat .7s
  forwards;
}

@keyframes damageFloat{

  from{
    opacity:1;
  }

  to{
    opacity:0;

    transform:
    translate(-50%,-100%);
  }

}


/* =========================
   PANEL
   ========================= */

#panel{
  margin-top:10px;

  background:#181e29;

  border-radius:10px;

  padding:10px;
}

#skillDisplay{
  font-size:14px;

  margin-bottom:7px;
}

#log{
  height:105px;

  overflow:auto;

  font-size:12px;

  line-height:1.5;

  color:#bfc8d8;
}

.debug{
  color:#8ee29a;

  font-weight:700;
}

.note{
  margin-top:8px;

  color:#8f9aad;

  font-size:11px;

  line-height:1.4;
}

</style>
</head>

<body>

<div id="app">

<h2>
⚔️ Mage Idle — P0.2C-1
</h2>


<div id="topbar">

<div id="stats">

Lv.<span id="level">1</span>

｜ EXP
<span id="exp">0</span>/<span id="expNeed">100</span>

｜ 擊殺
<span id="kills">0</span>

<br>

HP
<span id="hpText">100</span>/100

｜ 狀態
<span id="stateText">
尋找目標
</span>

</div>


<button id="pauseBtn">
暫停
</button>

</div>


<div id="game">

<div id="mage">

<div id="mageSprite"></div>

<div class="hp">
<span id="mageHp"></span>
</div>

</div>

</div>


<div id="panel">

<div id="skillDisplay">

下一技能：

<strong id="nextSkill">
🔥 Fire
</strong>

</div>


<div id="log">

<div class="debug">
P0.2C-1 CLEAN SPRITE SYSTEM
</div>

<div>
48 格精準動畫系統啟動
</div>

</div>


<div class="note">

Clean Sprite /
Facing Lock /
Cast Animation

</div>

</div>

</div>


<script>

/* =========================
   DOM
   ========================= */

const game=
document.getElementById("game");

const mageEl=
document.getElementById("mage");

const mageSprite=
document.getElementById(
"mageSprite"
);

const hpText=
document.getElementById(
"hpText"
);

const mageHpBar=
document.getElementById(
"mageHp"
);

const expEl=
document.getElementById(
"exp"
);

const expNeedEl=
document.getElementById(
"expNeed"
);

const levelEl=
document.getElementById(
"level"
);

const killsEl=
document.getElementById(
"kills"
);

const stateText=
document.getElementById(
"stateText"
);

const nextSkillEl=
document.getElementById(
"nextSkill"
);

const pauseBtn=
document.getElementById(
"pauseBtn"
);

const logEl=
document.getElementById(
"log"
);


/* =========================
   GAME
   ========================= */

let paused=false;

let lastTime=
performance.now();

let kills=0;

let exp=0;

let expNeed=100;

let level=1;


/* =========================
   SPRITE GRID
   ========================= */

/*

Clean Sheet：

8 columns
6 rows

0 = Idle
1 = Down
2 = Left
3 = Right
4 = Up
5 = Cast

每一格在遊戲裡：
82 × 82

*/

const FRAME_SIZE=82;


const ROW={

 idle:0,

 down:1,

 left:2,

 right:3,

 up:4,

 cast:5

};


/* =========================
   MAGE
   ========================= */

const mage={

 x:0,
 y:0,

 hp:100,
 maxHp:100,

 speed:70,

 target:null,

 skillIndex:0,

 lastAttack:0,

 state:"idle",

 direction:"down",

 facingLocked:false,

 lockedTargetId:null,

 frame:0,

 frameTimer:0,

 casting:false,

 castStart:0,

 /*
 8 格 × 75ms
 約 0.6 秒
 */

 castDuration:600

};


/* =========================
   SPRITE
   ========================= */

function setSprite(
 row,
 frame
){

 /*
 完全固定格子。

 不再使用猜測 offset。
 */

 const x=
 -(frame*FRAME_SIZE);

 const y=
 -(row*FRAME_SIZE);


 mageSprite.style
 .backgroundPosition=
 x+"px "+y+"px";

}


/* =========================
   DIRECTION
   ========================= */

function calculateDirection(
 dx,
 dy
){

 const angle=
 Math.atan2(
  dy,
  dx
 )*
 180/
 Math.PI;


 if(
  angle>=-45 &&
  angle<45
 ){
  return "right";
 }


 if(
  angle>=45 &&
  angle<135
 ){
  return "down";
 }


 if(
  angle>=-135 &&
  angle<-45
 ){
  return "up";
 }


 return "left";

}


/* =========================
   FACING LOCK
   ========================= */

function lockFacing(
 target
){

 const dx=
 target.x-
 mage.x;

 const dy=
 target.y-
 mage.y;


 mage.direction=
 calculateDirection(
  dx,
  dy
 );


 mage.facingLocked=
 true;


 mage.lockedTargetId=
 target.id;

}


function unlockFacing(){

 mage.facingLocked=
 false;

 mage.lockedTargetId=
 null;

}


/* =========================
   CAST
   ========================= */

function startCast(now){

 mage.casting=true;

 mage.castStart=now;

 mage.frame=0;

 mage.frameTimer=0;

}


/* =========================
   ANIMATION
   ========================= */

function updateAnimation(
 dt,
 now
){

 /*
 =====================
 CAST
 =====================
 */

 if(
  mage.casting
 ){

  const elapsed=
  now-
  mage.castStart;


  /*
  Cast 共有 8 格。

  600ms / 8
  */

  const castFrame=
  Math.min(
   7,
   Math.floor(
    elapsed/
    (mage.castDuration/8)
   )
  );


  setSprite(
   ROW.cast,
   castFrame
  );


  if(
   elapsed>=
   mage.castDuration
  ){

   mage.casting=false;

   mage.frame=0;

   mage.frameTimer=0;

  }


  return;

 }


 /*
 =====================
 NORMAL
 =====================
 */

 let row;


 if(
  mage.state==="idle"
 ){

  row=
  ROW.idle;

 }

 else{

  row=
  ROW[
   mage.direction
  ];

 }


 mage.frameTimer+=dt;


 const speed=
 mage.state==="walk"
 ?110
 :220;


 if(
  mage.frameTimer>=speed
 ){

  mage.frameTimer=0;

  mage.frame=
  (mage.frame+1)%8;

 }


 setSprite(
  row,
  mage.frame
 );

}


/* =========================
   SKILLS
   ========================= */

const skills=[

 {

  name:"🔥 Fire",

  icon:"🔥",

  range:145,

  damage:10,

  cooldown:1000

 },

 {

  name:"⚡ Lightning",

  icon:"⚡",

  range:145,

  damage:10,

  cooldown:1000

 },

 {

  name:"❄️ Ice",

  icon:"❄️",

  range:48,

  damage:7,

  cooldown:650

 }

];


/* =========================
   SLIMES
   ========================= */

const slimes=[];

const SLIME_COUNT=8;


/* =========================
   HELPERS
   ========================= */

function clamp(
 v,
 min,
 max
){

 return Math.max(
  min,
  Math.min(
   max,
   v
  )
 );

}


function distance(
 a,
 b
){

 return Math.hypot(

  a.x-b.x,

  a.y-b.y

 );

}


function log(text){

 const div=
 document.createElement(
  "div"
 );

 div.textContent=
 text;

 logEl.appendChild(
  div
 );


 while(
  logEl.children.length>
  30
 ){

  logEl.removeChild(
   logEl.children[1]
  );

 }


 logEl.scrollTop=
 logEl.scrollHeight;

}


/* =========================
   SLIME
   ========================= */

function createSlime(
 index
){

 const el=
 document.createElement(
  "div"
 );

 el.className=
 "slime";


 el.innerHTML=`

 <div class="slimeIcon">
 🟢
 </div>

 <div class="hp">
 <span></span>
 </div>

 `;


 game.appendChild(
  el
 );


 const slime={

  id:index,

  x:0,
  y:0,

  hp:50,

  maxHp:50,

  attack:5,

  alive:true,

  respawnAt:0,

  lastAttack:0,

  el:el,

  hpEl:
  el.querySelector(
   ".hp span"
  )

 };


 slimes.push(
  slime
 );


 respawnSlime(
  slime,
  true
 );

}


/* =========================
   RESPAWN
   ========================= */

function respawnSlime(
 slime,
 initial=false
){

 const w=
 game.clientWidth;

 const h=
 game.clientHeight;


 slime.x=
 35+
 Math.random()*
 Math.max(
  10,
  w-70
 );


 slime.y=
 45+
 Math.random()*
 Math.max(
  10,
  h-90
 );


 if(initial){

  if(
   distance(
    mage,
    slime
   )<100
  ){

   slime.x=
   clamp(
    slime.x+120,
    40,
    w-40
   );

  }

 }


 slime.hp=
 slime.maxHp;

 slime.alive=true;

 slime.el.style.display=
 "block";


 updateSlime(
  slime
 );

}


/* =========================
   UPDATE SLIME
   ========================= */

function updateSlime(
 slime
){

 slime.el.style.left=
 slime.x+"px";


 slime.el.style.top=
 slime.y+"px";


 slime.hpEl.style.width=
 (
  slime.hp/
  slime.maxHp*
  100
 )+"%";

}


/* =========================
   TARGET
   ========================= */

let targetRing=null;


function createTargetRing(){

 targetRing=
 document.createElement(
  "div"
 );

 targetRing.className=
 "targetRing";

 targetRing.style.display=
 "none";

 game.appendChild(
  targetRing
 );

}


function findTarget(){

 let best=null;

 let bestDistance=
 Infinity;


 for(
  const slime
  of slimes
 ){

  if(!slime.alive)
   continue;


  const d=
  distance(
   mage,
   slime
  );


  if(
   d<
   bestDistance
  ){

   bestDistance=d;

   best=slime;

  }

 }


 if(
  mage.target!==best
 ){

  unlockFacing();

 }


 mage.target=
 best;

}


/* =========================
   EFFECT
   ========================= */

function spellEffect(
 target,
 skill
){

 const el=
 document.createElement(
  "div"
 );

 el.className=
 "spell";

 el.textContent=
 skill.icon;


 el.style.left=
 target.x+"px";


 el.style.top=
 (
  target.y-15
 )+"px";


 game.appendChild(
  el
 );


 setTimeout(
  ()=>el.remove(),
  450
 );

}


/* =========================
   DAMAGE
   ========================= */

function damageText(
 target,
 amount
){

 const el=
 document.createElement(
  "div"
 );

 el.className=
 "damage";

 el.textContent=
 "-"+amount;


 el.style.left=
 target.x+"px";


 el.style.top=
 (
  target.y-25
 )+"px";


 game.appendChild(
  el
 );


 setTimeout(
  ()=>el.remove(),
  700
 );

}


/* =========================
   KILL
   ========================= */

function killSlime(
 slime
){

 slime.alive=false;

 slime.el.style.display=
 "none";


 slime.respawnAt=
 performance.now()+
 5000;


 kills++;

 exp+=10;


 log(
  "🟢 Slime 擊倒！ +10 EXP"
 );


 unlockFacing();


 if(
  exp>=expNeed
 ){

  exp-=expNeed;

  level++;

  expNeed=
  Math.floor(
   expNeed*1.25
  );


  log(
   "✨ 升級！ Lv."+
   level
  );

 }


 mage.target=null;

}


/* =========================
   ATTACK
   ========================= */

function attack(
 target,
 now
){

 const skill=
 skills[
  mage.skillIndex
 ];


 if(
  now-
  mage.lastAttack
  <
  skill.cooldown
 )
 return;


 mage.lastAttack=
 now;


 /*
 =========================
 CAST START
 =========================
 */

 startCast(now);


 /*
 魔法命中稍微延後。

 讓施法動作先播出，
 不會角色還沒舉杖
 敵人就先扣血。
 */

 setTimeout(
 ()=>{

  /*
  目標可能已經死了。
  */

  if(
   !target.alive
  )
  return;


  spellEffect(
   target,
   skill
  );


  target.hp-=
  skill.damage;


  damageText(
   target,
   skill.damage
  );


  log(
   skill.name+
   " → Slime -"+
   skill.damage
  );


  if(
   target.hp<=0
  ){

   target.hp=0;

   updateSlime(
    target
   );

   killSlime(
    target
   );

  }

  else{

   updateSlime(
    target
   );

  }

 },
 330
 );


 mage.skillIndex=
 (
  mage.skillIndex+1
 )%
 skills.length;


 nextSkillEl.textContent=
 skills[
  mage.skillIndex
 ].name;

}


/* =========================
   ENEMY ATTACK
   ========================= */

function enemyAttack(now){

 for(
  const slime
  of slimes
 ){

  if(!slime.alive)
   continue;


  const d=
  distance(
   mage,
   slime
  );


  if(d>52)
   continue;


  if(
   now-
   slime.lastAttack
   <
   1000
  )
   continue;


  slime.lastAttack=
  now;


  mage.hp-=
  slime.attack;


  if(
   mage.hp<=0
  ){

   mage.hp=0;

   updateHUD();


   log(
    "💀 Mage 倒下，返回起點"
   );


   mage.hp=
   mage.maxHp;


   mage.x=
   game.clientWidth/2;


   mage.y=
   game.clientHeight-80;


   mage.target=null;

   mage.state=
   "idle";

   mage.direction=
   "down";

   mage.casting=
   false;


   unlockFacing();

   break;

  }

 }

}


/* =========================
   AI
   ========================= */

function updateMage(
 dt,
 now
){

 if(
  !mage.target ||
  !mage.target.alive
 ){

  findTarget();

 }


 if(
  !mage.target
 ){

  mage.state=
  "idle";


  stateText.textContent=
  "等待怪物";


  return;

 }


 const target=
 mage.target;


 const dx=
 target.x-
 mage.x;


 const dy=
 target.y-
 mage.y;


 const d=
 Math.hypot(
  dx,
  dy
 );


 const skill=
 skills[
  mage.skillIndex
 ];


 /*
 =========================
 MOVEMENT
 =========================
 */

 if(
  d>
  skill.range
 ){

  mage.state=
  "walk";


  /*
  移動時允許重新朝向。
  */

  mage.facingLocked=
  false;


  mage.direction=
  calculateDirection(
   dx,
   dy
  );


  stateText.textContent=
  "追蹤目標";


  /*
  Cast 時不移動。

  防止施法中滑行。
  */

  if(
   !mage.casting
  ){

   const step=
   mage.speed*
   (
    dt/1000
   );


   mage.x+=
   dx/d*
   Math.min(
    step,
    d
   );


   mage.y+=
   dy/d*
   Math.min(
    step,
    d
   );

  }

 }


 /*
 =========================
 COMBAT
 =========================
 */

 else{

  mage.state=
  "combat";


  if(
   !mage.facingLocked ||
   mage.lockedTargetId!==
   target.id
  ){

   lockFacing(
    target
   );

  }


  stateText.textContent=
  mage.casting
  ?"施法中"
  :"鎖定攻擊";


  attack(
   target,
   now
  );

 }


 mage.x=
 clamp(
  mage.x,
  42,
  game.clientWidth-42
 );


 mage.y=
 clamp(
  mage.y,
  48,
  game.clientHeight-48
 );

}


/* =========================
   RESPAWN
   ========================= */

function updateRespawns(now){

 for(
  const slime
  of slimes
 ){

  if(
   !slime.alive &&
   now>=
   slime.respawnAt
  ){

   respawnSlime(
    slime
   );


   log(
    "🟢 Slime 重生"
   );

  }

 }

}


/* =========================
   VISUAL
   ========================= */

function updateVisual(){

 mageEl.style.left=
 mage.x+"px";


 mageEl.style.top=
 mage.y+"px";


 if(
  mage.target &&
  mage.target.alive
 ){

  targetRing.style.display=
  "block";


  targetRing.style.left=
  mage.target.x+"px";


  targetRing.style.top=
  (
   mage.target.y+14
  )+"px";

 }

 else{

  targetRing.style.display=
  "none";

 }

}


/* =========================
   HUD
   ========================= */

function updateHUD(){

 hpText.textContent=
 mage.hp;


 mageHpBar.style.width=
 (
  mage.hp/
  mage.maxHp*
  100
 )+"%";


 expEl.textContent=
 exp;

 expNeedEl.textContent=
 expNeed;

 levelEl.textContent=
 level;

 killsEl.textContent=
 kills;

}


/* =========================
   LOOP
   ========================= */

function loop(now){

 const dt=
 Math.min(
  50,
  now-lastTime
 );


 lastTime=
 now;


 if(!paused){

  updateRespawns(
   now
  );


  updateMage(
   dt,
   now
  );


  enemyAttack(
   now
  );


  updateAnimation(
   dt,
   now
  );


  updateVisual();


  updateHUD();

 }


 requestAnimationFrame(
  loop
 );

}


/* =========================
   PAUSE
   ========================= */

pauseBtn.addEventListener(
"click",
()=>{

 paused=
 !paused;


 pauseBtn.textContent=
 paused
 ?"繼續"
 :"暫停";


 log(
