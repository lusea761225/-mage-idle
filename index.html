<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Mage Idle - P0.2C-R2.1</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  background:#10141c;
  color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

#app{
  max-width:760px;
  margin:auto;
  padding:12px;
}

h2{
  margin:4px 0 10px;
  font-size:20px;
}

#topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

#stats{
  font-size:13px;
  line-height:1.55;
}

button{
  border:0;
  border-radius:9px;
  padding:9px 14px;
  background:#34445f;
  color:#fff;
  font-weight:bold;
}

#game{
  position:relative;
  height:520px;
  overflow:hidden;
  border:2px solid #4c6646;
  border-radius:12px;
  background:linear-gradient(#638f52,#527c45);
}

/* ==============================
   MAGE
============================== */

#mage{
  position:absolute;
  width:92px;
  height:104px;
  transform:translate(-50%,-78%);
  z-index:20;
  pointer-events:none;
}

/*
  這次不直接裁整張圖。

  用一個 180 × 180 的邏輯 viewport，
  角色腳底固定在同一個位置。
*/

#mageSprite{
  position:absolute;
  width:90px;
  height:90px;
  left:1px;
  bottom:8px;

  background-image:
  url("B00876D4-E994-42DD-8194-18CB4F04897B.png");

  background-repeat:no-repeat;

  /*
    原圖設計基準 1620 × 1620。
    遊戲顯示縮成 810 × 810。

    因此：
    每格 180 → 顯示 90px。
  */
  background-size:810px 810px;

  image-rendering:auto;

  filter:
  drop-shadow(0 3px 2px rgba(0,0,0,.35));
}

.hp{
  position:absolute;
  height:6px;
  background:#321;
  border:1px solid #111;
  border-radius:4px;
  overflow:hidden;
}

.hp span{
  display:block;
  height:100%;
  background:#e55353;
}

#mage .hp{
  left:8px;
  right:8px;
  bottom:0;
}

/* ==============================
   SLIME
============================== */

.slime{
  position:absolute;
  width:44px;
  height:48px;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:10;
}

.slimeIcon{
  font-size:31px;
  line-height:34px;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
}

.slime .hp{
  left:2px;
  right:2px;
  bottom:0;
}

.targetRing{
  position:absolute;
  width:50px;
  height:24px;
  border:2px solid rgba(255,230,90,.85);
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:5;
}

/* ==============================
   EFFECTS
============================== */

.spell{
  position:absolute;
  transform:translate(-50%,-50%);
  font-size:26px;
  z-index:40;
  pointer-events:none;
  animation:spellPop .45s forwards;
}

@keyframes spellPop{
  0%{
    opacity:0;
    transform:translate(-50%,-40%) scale(.5)
  }
  40%{
    opacity:1;
    transform:translate(-50%,-70%) scale(1.3)
  }
  100%{
    opacity:0;
    transform:translate(-50%,-120%) scale(.8)
  }
}

.damage{
  position:absolute;
  transform:translate(-50%,-50%);
  font-size:13px;
  font-weight:bold;
  z-index:50;
  text-shadow:0 1px 3px #000;
  animation:damageFloat .7s forwards;
}

@keyframes damageFloat{
  to{
    opacity:0;
    transform:translate(-50%,-110%)
  }
}

/* ==============================
   PANEL
============================== */

#panel{
  margin-top:10px;
  padding:10px;
  background:#181e29;
  border-radius:10px;
}

#log{
  height:105px;
  overflow:auto;
  color:#bdc6d6;
  font-size:12px;
  line-height:1.5;
}

.debug{
  color:#8ee29a;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="app">

<h2>⚔️ Mage Idle — P0.2C-R2.1</h2>

<div id="topbar">

<div id="stats">
Lv.<span id="level">1</span>
｜ EXP <span id="exp">0</span>/<span id="expNeed">100</span>
｜ 擊殺 <span id="kills">0</span>
<br>
HP <span id="hpText">100</span>/100
｜ 狀態 <span id="stateText">尋找目標</span>
</div>

<button id="pauseBtn">暫停</button>

</div>

<div id="game">

<div id="mage">
  <div id="mageSprite"></div>
  <div class="hp">
    <span id="mageHp"></span>
  </div>
</div>

</div>

<div id="panel">

<div>
下一技能：
<strong id="nextSkill">🔥 Fire</strong>
</div>

<div id="log">
  <div class="debug">P0.2C-R2.1</div>
  <div>🔒 P0.2B-4 CORE</div>
  <div>🎞️ 180 × 180 GRID</div>
</div>

</div>

</div>

<script>

/* ==============================
   DOM
============================== */

const game=document.getElementById("game");
const mageEl=document.getElementById("mage");
const mageSprite=document.getElementById("mageSprite");

const hpText=document.getElementById("hpText");
const mageHp=document.getElementById("mageHp");

const levelEl=document.getElementById("level");
const expEl=document.getElementById("exp");
const expNeedEl=document.getElementById("expNeed");
const killsEl=document.getElementById("kills");

const stateText=document.getElementById("stateText");
const nextSkill=document.getElementById("nextSkill");

const pauseBtn=document.getElementById("pauseBtn");
const logEl=document.getElementById("log");


/* ==============================
   GAME
============================== */

let paused=false;
let lastTime=performance.now();

let level=1;
let exp=0;
let expNeed=100;
let kills=0;


/* ==============================
   SPRITE GRID
============================== */

/*
9 × 9

ROW
0 Idle
1 Down
2 Left
3 Right
4 Up
5 Cast Down
6 Cast Left
7 Cast Right
8 Cast Up

遊戲中每格顯示為 90 × 90。
*/

const CELL=90;

const ROW={
  idle:0,
  down:1,
  left:2,
  right:3,
  up:4,
  castDown:5,
  castLeft:6,
  castRight:7,
  castUp:8
};


function setSprite(row,frame){

  frame=Math.max(
    0,
    Math.min(8,frame)
  );

  mageSprite.style.backgroundPosition=
    (-frame*CELL)+"px "+
    (-row*CELL)+"px";
}


/* ==============================
   MAGE
============================== */

const mage={

  x:0,
  y:0,

  hp:100,
  maxHp:100,

  speed:70,

  target:null,

  direction:"down",
  lockedDirection:"down",
  facingLocked:false,

  frame:0,
  frameTimer:0,

  casting:false,
  castStart:0,
  castDuration:720,

  castSkill:null,
  castTarget:null,
  castHit:false,

  skillIndex:0,
  lastAttack:0
};


/* ==============================
   SKILLS
============================== */

const skills=[

{
  name:"🔥 Fire",
  icon:"🔥",
  range:145,
  damage:10,
  cooldown:1000
},

{
  name:"⚡ Lightning",
  icon:"⚡",
  range:145,
  damage:10,
  cooldown:1000
},

{
  name:"❄️ Ice",
  icon:"❄️",
  range:48,
  damage:7,
  cooldown:650
}

];


/* ==============================
   HELPERS
============================== */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}


function directionToTarget(target){

  const dx=target.x-mage.x;
  const dy=target.y-mage.y;

  const angle=
    Math.atan2(dy,dx)*
    180/Math.PI;

  if(angle>=-45 && angle<45)
    return "right";

  if(angle>=45 && angle<135)
    return "down";

  if(angle>=-135 && angle<-45)
    return "up";

  return "left";
}


function moveRow(direction){

  if(direction==="left")
    return ROW.left;

  if(direction==="right")
    return ROW.right;

  if(direction==="up")
    return ROW.up;

  return ROW.down;
}


function getCastRow(direction){

  if(direction==="left")
    return ROW.castLeft;

  if(direction==="right")
    return ROW.castRight;

  if(direction==="up")
    return ROW.castUp;

  return ROW.castDown;
}


/* ==============================
   SLIMES
============================== */

const slimes=[];


function createSlime(id){

  const el=document.createElement("div");

  el.className="slime";

  el.innerHTML=
  `<div class="slimeIcon">🟢</div>
   <div class="hp"><span></span></div>`;

  game.appendChild(el);

  const slime={

    id,

    x:0,
    y:0,

    hp:50,
    maxHp:50,

    attack:5,

    alive:true,

    respawnAt:0,

    lastAttack:0,

    el,

    hpEl:
    el.querySelector(".hp span")
  };

  slimes.push(slime);

  respawnSlime(slime);
}


function respawnSlime(slime){

  slime.x=
    35+
    Math.random()*
    (game.clientWidth-70);

  slime.y=
    40+
    Math.random()*
    (game.clientHeight-90);

  slime.hp=slime.maxHp;

  slime.alive=true;

  slime.el.style.display="block";

  updateSlime(slime);
}


function updateSlime(slime){

  slime.el.style.left=
    slime.x+"px";

  slime.el.style.top=
    slime.y+"px";

  slime.hpEl.style.width=
    (
      slime.hp/
      slime.maxHp*
      100
    )+"%";
}


/* ==============================
   TARGET RING
============================== */

const targetRing=
document.createElement("div");

targetRing.className="targetRing";

targetRing.style.display="none";

game.appendChild(targetRing);


/* ==============================
   TARGET
============================== */

function findTarget(){

  let best=null;
  let bestDistance=Infinity;

  for(const slime of slimes){

    if(!slime.alive)
      continue;

    const d=
      distance(mage,slime);

    if(d<bestDistance){

      best=slime;
      bestDistance=d;
    }
  }

  mage.target=best;
  mage.facingLocked=false;
}


/* ==============================
   FACING LOCK
============================== */

function lockFacing(){

  if(!mage.target)
    return;

  mage.direction=
    directionToTarget(
      mage.target
    );

  mage.lockedDirection=
    mage.direction;

  mage.facingLocked=true;
}


/* ==============================
   WALK
============================== */

function walkAnimation(dt){

  mage.frameTimer+=dt;

  if(mage.frameTimer>=125){

    mage.frameTimer=0;

    mage.frame=
      (mage.frame+1)%9;
  }

  setSprite(
    moveRow(mage.direction),
    mage.frame
  );
}


/* ==============================
   IDLE
============================== */

function idleAnimation(dt){

  mage.frameTimer+=dt;

  if(mage.frameTimer>=200){

    mage.frameTimer=0;

    mage.frame=
      (mage.frame+1)%9;
  }

  setSprite(
    ROW.idle,
    mage.frame
  );
}


/* ==============================
   CAST
============================== */

function startCast(skill,now){

  if(
    mage.casting ||
    !mage.target
  )
    return;

  /*
    最重要：
    Cast 開始前重新確認一次
    真正的怪物方向。
  */

  lockFacing();

  mage.casting=true;

  mage.castStart=now;

  mage.castSkill=skill;

  mage.castTarget=mage.target;

  mage.castHit=false;

  mage.frame=0;
  mage.frameTimer=0;
}


function castAnimation(now){

  const elapsed=
    now-mage.castStart;

  const frame=
    Math.min(
      8,
      Math.floor(
        elapsed/
        (mage.castDuration/9)
      )
    );

  setSprite(
    getCastRow(
      mage.lockedDirection
    ),
    frame
  );


  /*
    中段命中
  */

  if(
    elapsed>=360 &&
    !mage.castHit
  ){

    mage.castHit=true;

    applySpell();
  }


  /*
    Cast 結束
  */

  if(
    elapsed>=mage.castDuration
  ){

    mage.casting=false;

    mage.castSkill=null;
    mage.castTarget=null;

    mage.frame=0;
    mage.frameTimer=0;
  }
}


/* ==============================
   SPELL HIT
============================== */

function applySpell(){

  const target=
    mage.castTarget;

  const skill=
    mage.castSkill;

  if(
    !target ||
    !target.alive ||
    !skill
  )
    return;

  target.hp-=skill.damage;

  showSpell(target,skill);
  showDamage(target,skill.damage);

  addLog(
    skill.name+
    " → Slime -"+
    skill.damage
  );

  if(target.hp<=0){

    target.hp=0;

    updateSlime(target);

    killSlime(target);

  }else{

    updateSlime(target);
  }
}


/* ==============================
   EFFECT
============================== */

function showSpell(target,skill){

  const el=
    document.createElement("div");

  el.className="spell";

  el.textContent=skill.icon;

  el.style.left=
    target.x+"px";

  el.style.top=
    (target.y-15)+"px";

  game.appendChild(el);

  setTimeout(
    ()=>el.remove(),
    450
  );
}


function showDamage(target,value){

  const el=
    document.createElement("div");

  el.className="damage";

  el.textContent="-"+value;

  el.style.left=
    target.x+"px";

  el.style.top=
    (target.y-25)+"px";

  game.appendChild(el);

  setTimeout(
    ()=>el.remove(),
    700
  );
}


/* ==============================
   KILL
============================== */

function killSlime(slime){

  slime.alive=false;

  slime.el.style.display="none";

  slime.respawnAt=
    performance.now()+5000;

  kills++;

  exp+=10;

  addLog(
    "🟢 Slime 擊倒！ +10 EXP"
  );


  if(exp>=expNeed){

    exp-=expNeed;

    level++;

    expNeed=
      Math.floor(
        expNeed*1.25
      );

    addLog(
      "✨ 升級 Lv."+
      level
    );
  }


  mage.target=null;

  mage.facingLocked=false;
}


/* ==============================
   ATTACK
============================== */

function attack(now){

  if(
    !mage.target ||
    mage.casting
  )
    return;

  const skill=
    skills[mage.skillIndex];

  if(
    now-mage.lastAttack<
    skill.cooldown
  )
    return;

  mage.lastAttack=now;

  startCast(skill,now);

  mage.skillIndex=
    (mage.skillIndex+1)%
    skills.length;

  nextSkill.textContent=
    skills[
      mage.skillIndex
    ].name;
}


/* ==============================
   AI
============================== */

function updateMage(dt,now){

  if(
    !mage.target ||
    !mage.target.alive
  ){

    findTarget();
  }


  if(!mage.target){

    stateText.textContent=
      "等待怪物";

    idleAnimation(dt);

    return;
  }


  /*
    施法期間：
    不移動
    不轉向
  */

  if(mage.casting){

    stateText.textContent=
      "施法中";

    castAnimation(now);

    return;
  }


  const target=mage.target;

  const dx=
    target.x-mage.x;

  const dy=
    target.y-mage.y;

  const d=
    Math.hypot(dx,dy);

  const skill=
    skills[mage.skillIndex];


  /*
    追怪
  */

  if(d>skill.range){

    mage.facingLocked=false;

    mage.direction=
      directionToTarget(target);

    stateText.textContent=
      "追蹤目標";

    const step=
      mage.speed*
      dt/1000;

    mage.x+=
      dx/d*
      Math.min(step,d);

    mage.y+=
      dy/d*
      Math.min(step,d);

    walkAnimation(dt);
  }


  /*
    進入攻擊距離
  */

  else{

    if(!mage.facingLocked)
      lockFacing();

    stateText.textContent=
      "鎖定攻擊";

    /*
      等待技能 CD 時
      維持面向怪物。
    */

    setSprite(
      moveRow(
        mage.lockedDirection
      ),
      0
    );

    attack(now);
  }


  mage.x=
    Math.max(
      45,
      Math.min(
        game.clientWidth-45,
        mage.x
      )
    );

  mage.y=
    Math.max(
      60,
      Math.min(
        game.clientHeight-45,
        mage.y
      )
    );
}


/* ==============================
   ENEMY ATTACK
============================== */

function enemyAttack(now){

  for(const slime of slimes){

    if(!slime.alive)
      continue;

    if(
      distance(mage,slime)>52
    )
      continue;

    if(
      now-slime.lastAttack<
      1000
    )
      continue;

    slime.lastAttack=now;

    mage.hp-=slime.attack;


    if(mage.hp<=0){

      addLog(
        "💀 Mage 倒下，返回起點"
      );

      mage.hp=mage.maxHp;

      mage.x=
        game.clientWidth/2;

      mage.y=
        game.clientHeight-70;

      mage.target=null;

      mage.casting=false;

      mage.facingLocked=false;

      mage.direction="down";

      mage.lockedDirection="down";

      break;
    }
  }
}


/* ==============================
   RESPAWN
============================== */

function updateRespawns(now){

  for(const slime of slimes){

    if(
      !slime.alive &&
      now>=slime.respawnAt
    ){

      respawnSlime(slime);

      addLog(
        "🟢 Slime 重生"
      );
    }
  }
}


/* ==============================
   VISUAL
============================== */

function updateVisual(){

  mageEl.style.left=
    mage.x+"px";

  mageEl.style.top=
    mage.y+"px";


  if(
    mage.target &&
    mage.target.alive
  ){

    targetRing.style.display=
      "block";

    targetRing.style.left=
      mage.target.x+"px";

    targetRing.style.top=
      (mage.target.y+14)+"px";

  }else{

    targetRing.style.display=
      "none";
  }
}


/* ==============================
   HUD
============================== */

function updateHUD(){

  hpText.textContent=
    mage.hp;

  mageHp.style.width=
    (
      mage.hp/
      mage.maxHp*
      100
    )+"%";

  levelEl.textContent=
    level;

  expEl.textContent=
    exp;

  expNeedEl.textContent=
    expNeed;

  killsEl.textContent=
    kills;
}


/* ==============================
   LOG
============================== */

function addLog(text){

  const div=
    document.createElement("div");

  div.textContent=text;

  logEl.appendChild(div);

  while(
    logEl.children.length>30
  ){

    logEl.removeChild(
      logEl.children[1]
    );
  }

  logEl.scrollTop=
    logEl.scrollHeight;
}


/* ==============================
   LOOP
============================== */

function loop(now){

  const dt=
    Math.min(
      50,
      now-lastTime
    );

  lastTime=now;


  if(!paused){

    updateRespawns(now);

    updateMage(dt,now);

    enemyAttack(now);

    updateVisual();

    updateHUD();
  }

  requestAnimationFrame(loop);
}


/* ==============================
   PAUSE
============================== */

pauseBtn.onclick=()=>{

  paused=!paused;

  pauseBtn.textContent=
    paused
    ?"繼續"
    :"暫停";
};


/* ==============================
   START
============================== */

function start(){

  mage.x=
    game.clientWidth/2;

  mage.y=
    game.clientHeight-70;


  for(let i=0;i<8;i++){

    createSlime(i);
  }


  setSprite(
    ROW.idle,
    0
  );

  updateVisual();

  updateHUD();

  addLog(
    "✅ P0.2C-R2.1 啟動"
  );

  addLog(
    "🎞️ 9 × 9 / 180px GRID"
  );

  addLog(
    "🔒 P0.2B-4 CORE"
  );

  requestAnimationFrame(loop);
}


start();

</script>

</body>
</html>
