<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mage Idle - P0.2B</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#10141c;
  color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}

#app{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:12px;
}

h2{
  margin:4px 0 10px;
  font-size:20px;
}

#topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

#stats{
  font-size:13px;
  line-height:1.55;
}

button{
  border:0;
  border-radius:9px;
  padding:9px 14px;
  background:#34445f;
  color:white;
  font-weight:700;
}

button:active{
  transform:scale(.97);
}

#game{
  position:relative;
  width:100%;
  height:520px;
  overflow:hidden;
  border:2px solid #4c6646;
  border-radius:12px;

  background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.06) 0 2px,transparent 3px),
    radial-gradient(circle at 70% 70%,rgba(0,0,0,.08) 0 3px,transparent 4px),
    linear-gradient(#638f52,#527c45);

  box-shadow:inset 0 0 35px rgba(0,0,0,.22);
}

/* ========================================
   P0.2B MAGE
   ======================================== */

#mage{
  position:absolute;
  width:76px;
  height:92px;
  z-index:20;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

/*
  我們現在使用使用者剛上傳的新 Sprite Sheet。

  原圖：
  1536 x 1024

  畫面排列：
  左側標題欄
  上方編號欄
  6 排角色
  8 欄動畫

  這版用 background-position，
  並且把每一格限制在 mageSprite 裡。
*/

#mageSprite{
  position:absolute;
  width:76px;
  height:76px;
  left:0;
  top:0;

  background-image:
    url("7B2F9496-7B84-415D-8E8A-6574C534B37F.png");

  background-repeat:no-repeat;

  /*
    將 1536px 寬縮成 768px。
    高度跟著變成 512px。
  */
  background-size:768px 512px;

  /*
    預設 Idle 第一格。
    JS 會持續更新。
  */
  background-position:-78px -23px;

  filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));
}

/* HP BAR */

.hp{
  position:absolute;
  height:6px;
  background:#321;
  border:1px solid rgba(0,0,0,.65);
  border-radius:4px;
  overflow:hidden;
}

.hp > span{
  display:block;
  height:100%;
  width:100%;
  background:#e55353;
}

#mage .hp{
  left:8px;
  right:8px;
  bottom:2px;
}

/* ========================================
   SLIMES
   ======================================== */

.slime{
  position:absolute;
  width:44px;
  height:48px;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:10;
}

.slimeIcon{
  font-size:31px;
  line-height:34px;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
}

.slime .hp{
  left:2px;
  right:2px;
  bottom:0;
}

/* ========================================
   SPELL EFFECT
   ======================================== */

.spell{
  position:absolute;
  transform:translate(-50%,-50%);
  z-index:30;
  pointer-events:none;
  font-size:26px;
  animation:spellPop .42s ease-out forwards;
}

@keyframes spellPop{
  0%{
    transform:translate(-50%,-50%) scale(.5);
    opacity:0;
  }

  35%{
    transform:translate(-50%,-70%) scale(1.3);
    opacity:1;
  }

  100%{
    transform:translate(-50%,-110%) scale(.8);
    opacity:0;
  }
}

.damage{
  position:absolute;
  transform:translate(-50%,-50%);
  z-index:40;
  font-size:13px;
  font-weight:800;
  color:white;
  text-shadow:0 1px 3px #000;
  pointer-events:none;
  animation:damageFloat .7s forwards;
}

@keyframes damageFloat{
  from{
    opacity:1;
    transform:translate(-50%,-50%);
  }

  to{
    opacity:0;
    transform:translate(-50%,-100%);
  }
}

/* ========================================
   TARGET
   ======================================== */

.targetRing{
  position:absolute;
  width:50px;
  height:24px;
  border:2px solid rgba(255,230,90,.8);
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:5;
  pointer-events:none;
}

/* ========================================
   EVENT LOG
   ======================================== */

#panel{
  margin-top:10px;
  background:#181e29;
  border-radius:10px;
  padding:10px;
}

#skillDisplay{
  font-size:14px;
  margin-bottom:7px;
}

#log{
  height:105px;
  overflow:auto;
  font-size:12px;
  line-height:1.5;
  color:#bfc8d8;
}

.debug{
  color:#8ee29a;
  font-weight:700;
}

.note{
  margin-top:8px;
  color:#8f9aad;
  font-size:11px;
  line-height:1.4;
}
</style>
</head>

<body>

<div id="app">

  <h2>⚔️ Mage Idle — P0.2B</h2>

  <div id="topbar">

    <div id="stats">
      Lv.<span id="level">1</span>
      ｜ EXP <span id="exp">0</span>/<span id="expNeed">100</span>
      ｜ 擊殺 <span id="kills">0</span><br>

      HP <span id="hpText">100</span>/100
      ｜ 狀態 <span id="stateText">尋找目標</span>
    </div>

    <button id="pauseBtn">暫停</button>

  </div>

  <div id="game">

    <div id="mage">

      <div id="mageSprite"></div>

      <div class="hp">
        <span id="mageHp"></span>
      </div>

    </div>

  </div>

  <div id="panel">

    <div id="skillDisplay">
      下一技能：
      <strong id="nextSkill">🔥 Fire</strong>
    </div>

    <div id="log">
      <div class="debug">P0.2B DEBUG</div>
      <div>角色動畫系統啟動中...</div>
    </div>

    <div class="note">
      P0.2B：Idle / Down / Left / Right / Up / Cast 動畫測試
    </div>

  </div>

</div>

<script>

/* =========================================================
   DOM
   ========================================================= */

const game = document.getElementById("game");

const mageEl = document.getElementById("mage");
const mageSprite = document.getElementById("mageSprite");

const hpText = document.getElementById("hpText");
const mageHpBar = document.getElementById("mageHp");

const expEl = document.getElementById("exp");
const expNeedEl = document.getElementById("expNeed");
const levelEl = document.getElementById("level");
const killsEl = document.getElementById("kills");

const stateText = document.getElementById("stateText");
const nextSkillEl = document.getElementById("nextSkill");

const pauseBtn = document.getElementById("pauseBtn");
const logEl = document.getElementById("log");


/* =========================================================
   GAME STATE
   ========================================================= */

let paused = false;

let lastTime = performance.now();

let kills = 0;

let exp = 0;
let expNeed = 100;
let level = 1;


/* =========================================================
   MAGE
   ========================================================= */

const mage = {

  x:0,
  y:0,

  hp:100,
  maxHp:100,

  speed:70,

  target:null,

  skillIndex:0,

  lastAttack:0,

  state:"idle",

  direction:"down",

  animationFrame:0,

  animationTimer:0,

  castUntil:0

};


/* =========================================================
   SPRITE CONFIG
   ========================================================= */

/*
  Sprite Sheet 顯示後：

  sheet = 768 x 512

  每個角色中心大約間隔 78px。

  以下不是整張圖片平均切割，
  而是依照實際人物排列位置定位。
*/

const sprite = {

  startX:78,

  stepX:78,

  rows:{

    idle:46,

    down:110,

    left:170,

    right:231,

    up:293,

    cast:354

  }

};


/* =========================================================
   SKILLS
   ========================================================= */

const skills = [

  {
    name:"🔥 Fire",
    icon:"🔥",
    range:145,
    damage:10,
    cooldown:1000
  },

  {
    name:"⚡ Lightning",
    icon:"⚡",
    range:145,
    damage:10,
    cooldown:1000
  },

  {
    name:"❄️ Ice",
    icon:"❄️",
    range:48,
    damage:7,
    cooldown:650
  }

];


/* =========================================================
   SLIMES
   ========================================================= */

const slimes = [];

const SLIME_COUNT = 8;


/* =========================================================
   UTIL
   ========================================================= */

function clamp(v,min,max){

  return Math.max(
    min,
    Math.min(max,v)
  );

}


function distance(a,b){

  const dx = a.x - b.x;
  const dy = a.y - b.y;

  return Math.hypot(dx,dy);

}


function log(text){

  const div = document.createElement("div");

  div.textContent = text;

  logEl.appendChild(div);

  while(logEl.children.length > 30){
    logEl.removeChild(logEl.children[1]);
  }

  logEl.scrollTop = logEl.scrollHeight;

}


/* =========================================================
   CREATE SLIME
   ========================================================= */

function createSlime(index){

  const el = document.createElement("div");

  el.className = "slime";

  el.innerHTML = `
    <div class="slimeIcon">🟢</div>
    <div class="hp">
      <span></span>
    </div>
  `;

  game.appendChild(el);


  const slime = {

    id:index,

    x:0,
    y:0,

    hp:50,
    maxHp:50,

    attack:5,

    alive:true,

    respawnAt:0,

    lastAttack:0,

    el:el,

    hpEl:el.querySelector(".hp span")

  };


  slimes.push(slime);

  respawnSlime(slime,true);

}


/* =========================================================
   RESPAWN
   ========================================================= */

function respawnSlime(slime,initial=false){

  const w = game.clientWidth;
  const h = game.clientHeight;

  slime.x =
    35 +
    Math.random() *
    Math.max(10,w - 70);

  slime.y =
    45 +
    Math.random() *
    Math.max(10,h - 90);

  /*
    初始生成時避免直接貼在玩家身上
  */

  if(initial){

    const dx = slime.x - mage.x;
    const dy = slime.y - mage.y;

    if(Math.hypot(dx,dy) < 100){

      slime.x =
        clamp(
          slime.x + 120,
          40,
          w - 40
        );

    }

  }

  slime.hp = slime.maxHp;

  slime.alive = true;

  slime.el.style.display = "block";

  updateSlime(slime);

}


/* =========================================================
   UPDATE SLIME VISUAL
   ========================================================= */

function updateSlime(slime){

  slime.el.style.left =
    slime.x + "px";

  slime.el.style.top =
    slime.y + "px";

  slime.hpEl.style.width =
    (
      slime.hp /
      slime.maxHp *
      100
    ) + "%";

}


/* =========================================================
   TARGET
   ========================================================= */

let targetRing = null;


function createTargetRing(){

  targetRing =
    document.createElement("div");

  targetRing.className =
    "targetRing";

  targetRing.style.display =
    "none";

  game.appendChild(targetRing);

}


function findTarget(){

  let best = null;
  let bestDistance = Infinity;

  for(const slime of slimes){

    if(!slime.alive)
      continue;

    const d =
      distance(mage,slime);

    if(d < bestDistance){

      bestDistance = d;
      best = slime;

    }

  }

  mage.target = best;

}


/* =========================================================
   MAGE DIRECTION
   ========================================================= */

function updateDirection(dx,dy){

  if(
    Math.abs(dx) >
    Math.abs(dy)
  ){

    mage.direction =
      dx < 0
      ? "left"
      : "right";

  }
  else{

    mage.direction =
      dy < 0
      ? "up"
      : "down";

  }

}


/* =========================================================
   SPRITE ANIMATION
   ========================================================= */

function updateSprite(dt){

  let rowName;

  /*
    Cast 優先
  */

  if(
    performance.now() <
    mage.castUntil
  ){

    rowName = "cast";

  }
  else if(
    mage.state === "walk"
  ){

    rowName =
      mage.direction;

  }
  else{

    rowName = "idle";

  }


  /*
    動畫速度
  */

  const speed =
    rowName === "cast"
    ? 70
    : 110;


  mage.animationTimer += dt;


  if(
    mage.animationTimer >
    speed
  ){

    mage.animationTimer = 0;

    mage.animationFrame =
      (
        mage.animationFrame + 1
      ) % 8;

  }


  const x =
    sprite.startX +
    mage.animationFrame *
    sprite.stepX;

  const y =
    sprite.rows[rowName];


  mageSprite.style.backgroundPosition =
    (-x + 38) + "px " +
    (-y + 38) + "px";

}


/* =========================================================
   SPELL EFFECT
   ========================================================= */

function spellEffect(
  target,
  skill
){

  const el =
    document.createElement("div");

  el.className =
    "spell";

  el.textContent =
    skill.icon;

  el.style.left =
    target.x + "px";

  el.style.top =
    (
      target.y - 15
    ) + "px";

  game.appendChild(el);


  setTimeout(
    ()=>el.remove(),
    450
  );

}


/* =========================================================
   DAMAGE TEXT
   ========================================================= */

function damageText(
  target,
  amount
){

  const el =
    document.createElement("div");

  el.className =
    "damage";

  el.textContent =
    "-" + amount;

  el.style.left =
    target.x + "px";

  el.style.top =
    (
      target.y - 25
    ) + "px";

  game.appendChild(el);


  setTimeout(
    ()=>el.remove(),
    700
  );

}


/* =========================================================
   KILL
   ========================================================= */

function killSlime(slime){

  slime.alive = false;

  slime.el.style.display =
    "none";

  slime.respawnAt =
    performance.now() +
    5000;


  kills++;

  exp += 10;


  log(
    "🟢 Slime 擊倒！ +10 EXP"
  );


  if(exp >= expNeed){

    exp -= expNeed;

    level++;

    expNeed =
      Math.floor(
        expNeed * 1.25
      );

    log(
      "✨ 升級！ Lv." +
      level
    );

  }


  mage.target = null;

}


/* =========================================================
   ATTACK
   ========================================================= */

function attack(
  target,
  now
){

  const skill =
    skills[mage.skillIndex];


  if(
    now - mage.lastAttack <
    skill.cooldown
  )
    return;


  mage.lastAttack = now;


  /*
    播放施法動畫
  */

  mage.castUntil =
    now + 520;

  mage.animationFrame = 0;

  mage.animationTimer = 0;


  spellEffect(
    target,
    skill
  );


  target.hp -=
    skill.damage;


  damageText(
    target,
    skill.damage
  );


  log(
    skill.name +
    " → Slime -" +
    skill.damage
  );


  if(
    target.hp <= 0
  ){

    target.hp = 0;

    updateSlime(target);

    killSlime(target);

  }
  else{

    updateSlime(target);

  }


  mage.skillIndex =
    (
      mage.skillIndex + 1
    ) %
    skills.length;


  nextSkillEl.textContent =
    skills[
      mage.skillIndex
    ].name;

}


/* =========================================================
   ENEMY ATTACK
   ========================================================= */

function enemyAttack(now){

  for(const slime of slimes){

    if(!slime.alive)
      continue;


    const d =
      distance(
        mage,
        slime
      );


    if(d > 52)
      continue;


    if(
      now -
      slime.lastAttack <
      1000
    )
      continue;


    slime.lastAttack =
      now;


    mage.hp -=
      slime.attack;


    if(mage.hp <= 0){

      mage.hp = 0;

      updateHUD();

      log(
        "💀 Mage 倒下，返回起點"
      );


      mage.hp =
        mage.maxHp;

      mage.x =
        game.clientWidth / 2;

      mage.y =
        game.clientHeight - 80;

      mage.target =
        null;

      mage.state =
        "idle";

      break;

    }

  }

}


/* =========================================================
   MAGE AI
   ========================================================= */

function updateMage(
  dt,
  now
){

  if(
    !mage.target ||
    !mage.target.alive
  ){

    findTarget();

  }


  if(!mage.target){

    mage.state =
      "idle";

    stateText.textContent =
      "等待怪物";

    return;

  }


  const target =
    mage.target;


  const dx =
    target.x - mage.x;

  const dy =
    target.y - mage.y;

  const d =
    Math.hypot(dx,dy);


  updateDirection(
    dx,
    dy
  );


  const skill =
    skills[
      mage.skillIndex
    ];


  /*
    走向技能射程
  */

  if(
    d >
    skill.range
  ){

    mage.state =
      "walk";

    stateText.textContent =
      "移動中";


    const step =
      mage.speed *
      (
        dt / 1000
      );


    mage.x +=
      dx / d *
      Math.min(
        step,
        d
      );


    mage.y +=
      dy / d *
      Math.min(
        step,
        d
      );

  }
  else{

    mage.state =
      "idle";

    stateText.textContent =
      "戰鬥中";


    attack(
      target,
      now
    );

  }


  /*
    地圖邊界
  */

  mage.x =
    clamp(
      mage.x,
      38,
      game.clientWidth - 38
    );

  mage.y =
    clamp(
      mage.y,
      45,
      game.clientHeight - 45
    );

}


/* =========================================================
   RESPAWN CHECK
   ========================================================= */

function updateRespawns(now){

  for(
    const slime of slimes
  ){

    if(
      !slime.alive &&
      now >=
      slime.respawnAt
    ){

      respawnSlime(
        slime
      );

      log(
        "🟢 Slime 重生"
      );

    }

  }

}


/* =========================================================
   VISUAL
   ========================================================= */

function updateVisual(){

  mageEl.style.left =
    mage.x + "px";

  mageEl.style.top =
    mage.y + "px";


  if(
    mage.target &&
    mage.target.alive
  ){

    targetRing.style.display =
      "block";

    targetRing.style.left =
      mage.target.x +
      "px";

    targetRing.style.top =
      (
        mage.target.y +
        14
      ) + "px";

  }
  else{

    targetRing.style.display =
      "none";

  }

}


/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){

  hpText.textContent =
    mage.hp;

  mageHpBar.style.width =
    (
      mage.hp /
      mage.maxHp *
      100
    ) + "%";


  expEl.textContent =
    exp;

  expNeedEl.textContent =
    expNeed;

  levelEl.textContent =
    level;

  killsEl.textContent =
    kills;

}


/* =========================================================
   LOOP
   ========================================================= */

function loop(now){

  const dt =
    Math.min(
      50,
      now - lastTime
    );

  lastTime = now;


  if(!paused){

    updateRespawns(now);

    updateMage(
      dt,
      now
    );

    enemyAttack(now);

    updateSprite(dt);

    updateVisual();

    updateHUD();

  }


  requestAnimationFrame(
    loop
  );

}


/* =========================================================
   PAUSE
   ========================================================= */

pauseBtn.addEventListener(
  "click",
  ()=>{

    paused =
      !paused;

    pauseBtn.textContent =
      paused
      ? "繼續"
      : "暫停";


    log(
      paused
      ? "⏸ 遊戲暫停"
      : "▶️ 遊戲繼續"
    );

  }
);


/* =========================================================
   START
   ========================================================= */

function start(){

  mage.x =
    game.clientWidth / 2;

  mage.y =
    game.clientHeight - 80;


  createTargetRing();


  for(
    let i=0;
    i<SLIME_COUNT;
    i++
  ){

    createSlime(i);

  }


  updateVisual();

  updateHUD();

  updateSprite(0);


  log(
    "✅ P0.2B 啟動"
  );

  log(
    "🎞 角色方向動畫系統已載入"
  );


  requestAnimationFrame(
    loop
  );

}


start();

</script>

</body>
</html>
